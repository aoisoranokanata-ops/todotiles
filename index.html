  ${S.homeEdit ? '' : renderAgenda()}
  ${S.homeEdit ? '' : renderBackupNudge()}
  ${S.homeEdit ? '<p class="hint">左上の ⠿ をドラッグして並べ替え／タイルをタップして編集</p>' : ''}
  <div class="tiles ${S.homeEdit ? 'editing' : ''}" data-sort="lists">
    ${sortedLists().map(l => tileHTML(l, sel)).join('')}
    <button class="add-tile" data-act="add-list" aria-label="リストを追加">＋<span>リストを追加</span></button>
  </div>`;
}
function tileHTML(l, sel) {
  const ts = tasksOf(l.id);
  const st = todayStats(ts);
  const remain = ts.filter(t => !t.done).length;
  const sub = !ts.length ? 'タスクなし' : remain ? `残り <b>${remain}</b> 件` : 'すべて完了';
  const aria = `${l.name}、残り${remain}件${st.total ? `、今日の達成${Math.round(st.pct * 100)}%` : ''}`;
  return `<div class="tile ${sel === l.id ? 'sel' : ''}" data-sort-item data-id="${l.id}" style="--c:${esc(l.color)}">
    <button class="tile-main" data-act="open-list" data-id="${l.id}" aria-label="${esc(aria)}${S.homeEdit ? '（編集）' : ''}">
      <span class="tile-icon">${ringSVG(st.pct, 80, 7)}<span class="tile-emoji">${esc(l.icon)}</span>
        ${st.total && st.done === st.total ? '<span class="tile-badge">✓</span>' : ''}</span>
      <span class="tile-name">${esc(l.name)}</span>
      <span class="tile-sub">${sub}${st.total ? ` · 今日 ${st.done}/${st.total}` : ''}</span>
    </button>
    ${S.homeEdit ? `<span class="handle tile-grip" aria-hidden="true">${ICON.grip}</span><span class="tile-edit" aria-hidden="true">✎ 編集</span>` : ''}
  </div>`;
}
function renderPickHint() {
  return `<div class="placeholder"><div><div class="big">👈</div><p>左のタイルからリストを選んでください</p></div></div>`;
}
function renderSoon(view) {
  const m = { stats: ['📊', '統計', 'フェーズ4で追加します'] }[view];
  return `<header class="phead"><div class="ph-title"><h1>${m[1]}</h1></div></header>
    <div class="placeholder"><div><div class="big">${m[0]}</div><p>${m[2]}</p></div></div>`;
}

/* ---------- 9-2. リスト画面 ---------- */
function listHeader(l) {
  return `<header class="phead" style="--c:${esc(l.color)}">
    <button class="icon-btn back-btn" data-act="back" aria-label="ホームへ戻る">${ICON.back}</button>
    <div class="ph-title ph-list"><span class="ph-emoji" aria-hidden="true">${esc(l.icon)}</span><h1>${esc(l.name)}</h1></div>
    <button class="icon-btn" data-act="list-settings" data-id="${l.id}" aria-label="リストの設定">${ICON.more}</button>
  </header>`;
}

/* ---------- 9-2b. 買い物モード（type="shopping"） ---------- */
function renderShopping(l) {
  const ts = tasksOf(l.id).sort(byOrder);
  const active = ts.filter(t => !t.done);
  const bought = ts.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const freq = frequentItems(l.id);
  const freqShown = S.freqAll ? freq : freq.slice(0, 12);
  let html = listHeader(l) + `
  <div class="shop-add">
    <label style="flex:1;display:flex"><span class="sr-only">品名</span>
      <input class="inp" type="text" id="shop-input" data-list="${l.id}" placeholder="＋ 品名を追加（例：牛乳 ×2）" enterkeyhint="done" autocomplete="off" maxlength="100"></label>
    <button class="btn primary" data-act="shop-add" data-id="${l.id}">追加</button>
  </div>
  <div class="list-summary"><span>買う物 <b style="color:var(--text)">${active.length}</b> 品</span><span>タップで購入済み</span></div>`;

  html += active.length
    ? `<div class="shop-grid">${active.map(t => shopItem(t, l)).join('')}</div>`
    : `<div class="empty"><div class="big">${ts.length ? '🎉' : '🛒'}</div><p>${ts.length ? '買う物はすべて購入済みです' : '買う物はまだありません。<br>上の欄か「よく買う物」から追加できます。'}</p></div>`;

  if (freq.length) {
    html += `<div class="sec-head"><span>よく買う物</span>
      <button class="txt-btn" data-act="freq-edit" aria-pressed="${!!S.freqEdit}">${S.freqEdit ? '完了' : '編集'}</button></div>
      <div class="freq ${S.freqEdit ? 'editing' : ''}">${freqShown.map(h => `
        <button class="freq-chip" data-act="${S.freqEdit ? 'freq-del' : 'freq-add'}" data-key="${esc(h.name)}" data-id="${l.id}"
          aria-label="${esc(h.label)}（${h.count}回）${S.freqEdit ? 'を候補から削除' : 'を追加'}">
          <span class="fe">${esc(h.icon || guessEmoji(h.label))}</span><span class="fn">${esc(h.label)}</span><span class="fc">${S.freqEdit ? '✕' : h.count + '回'}</span></button>`).join('')}
      </div>
      ${freq.length > 12 ? `<div style="text-align:center"><button class="link-btn" data-act="freq-all">${S.freqAll ? '閉じる' : `ほか ${freq.length - 12}件を表示`}</button></div>` : ''}`;
  }
  if (bought.length) {
    html += `<div class="sec-head"><span>購入済み ${bought.length}品</span>
      <button class="txt-btn" data-act="clear-done" data-id="${l.id}">購入済みをすべてクリア</button></div>
      <div class="bought-list">${bought.map(t => `<button class="bought-chip" data-act="toggle" data-id="${t.id}" aria-label="${esc(t.title)} を未購入に戻す">
        <span>${esc(itemIcon(t))}</span><s>${esc(t.title)}</s>${t.quantity > 1 ? `<small>×${t.quantity}</small>` : ''}</button>`).join('')}</div>`;
  }
  return html;
}
function shopItem(t, l) {
  const q = t.quantity || 1;
  const due = dueInfo(t);
  return `<div class="shop-item" data-id="${t.id}" style="--c:${esc(l.color)}">
    <button class="shop-main" data-act="buy" data-id="${t.id}" aria-label="${esc(t.title)}${q > 1 ? ` ${q}個` : ''} を購入済みにする">
      <span class="shop-emoji" aria-hidden="true">${esc(itemIcon(t))}</span>
      <span class="shop-name">${t.priority ? `<span class="prio-dot p${t.priority}"></span>` : ''}${esc(t.title)}</span>
      ${due || t.note ? `<span class="shop-meta">${due ? `<span class="due ${due.overdue ? 'overdue' : due.today ? 'today' : ''}">${esc(due.label)}</span>` : ''}${t.note ? ' 📝' : ''}</span>` : ''}
    </button>
    <button class="shop-edit" data-act="edit-task" data-id="${t.id}" aria-label="${esc(t.title)} を編集">✎</button>
    <div class="shop-qty">
      <button data-act="qty" data-d="-1" data-id="${t.id}" aria-label="数量を減らす" ${q <= 1 ? 'disabled' : ''}>−</button>
      <span aria-label="数量 ${q}">×${q}</span>
      <button data-act="qty" data-d="1" data-id="${t.id}" aria-label="数量を増やす">＋</button>
    </div>
  </div>`;
}

function renderList(id) {
  const l = listById(id);
  if (!l) return renderPickHint();
  if (l.type === 'shopping') return renderShopping(l);
  const ts = tasksOf(id).sort(byOrder);
  const st = todayStats(ts);
  const style = l.completeStyle;
  const active = style === 'check' ? ts : ts.filter(t => !t.done);
  const done = ts.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const remain = ts.length - done.length;

  let html = listHeader(l) + `
  <div class="list-summary">
    <span>残り <b style="color:var(--text)">${remain}</b> 件</span>
    ${st.total ? `<span>今日 ${st.done}/${st.total} 完了（${Math.round(st.pct * 100)}%）</span>` : ''}
    <span class="chip">${esc(STYLE_INFO[style].label)}</span>
  </div>
  <div class="style-${style}">`;

  if (active.length) {
    html += `<div class="tasks" data-sort="tasks" data-list="${l.id}">${active.map(t => taskRow(t, l, true)).join('')}</div>`;
  } else {
    html += ts.length
      ? `<div class="empty"><div class="big">🎉</div><p>すべて完了しました</p></div>`
      : `<div class="empty"><div class="big">${esc(l.icon)}</div><p>タスクはまだありません。<br>下の ＋ から追加できます。</p></div>`;
  }

  if (style === 'strike' && done.length) {
    html += `<div class="sec-head"><span>完了 ${done.length}件</span><button class="txt-btn" data-act="clear-done" data-id="${l.id}">完了済みを削除</button></div>
      <div class="tasks">${done.map(t => taskRow(t, l, false)).join('')}</div>`;
  }
  if (style === 'check' && done.length) {
    html += `<div class="sec-head"><span></span><button class="txt-btn" data-act="clear-done" data-id="${l.id}">完了済み ${done.length}件を削除</button></div>`;
  }
  if (style === 'vanish' && done.length) {
    const open = S.historyOpen.has(l.id);
    const shown = done.slice(0, 100);
    html += `<div class="sec-head"><button class="sec-toggle" data-act="history" data-id="${l.id}" aria-expanded="${open}">${open ? '▾' : '▸'} 完了履歴 ${done.length}件</button>
      ${open ? `<button class="txt-btn" data-act="clear-done" data-id="${l.id}">履歴を消去</button>` : ''}</div>
      ${open ? `<div class="tasks">${shown.map(t => taskRow(t, l, false, true)).join('')}</div>${done.length > shown.length ? `<p class="hint" style="margin-top:8px">ほか ${done.length - shown.length}件</p>` : ''}` : ''}`;
  }
  html += `</div>`;
  return html;
}

function taskRow(t, l, sortable, showDoneDate = false) {
  const due = dueInfo(t);
  const subs = t.subtasks || [];
  const subDone = subs.filter(s => s.done).length;
  const open = S.expanded.has(t.id);
  const meta = [];
  if (showDoneDate && t.doneAt) meta.push(`<span>✓ ${fmtMD(dateKey(t.doneAt))}</span>`);
  if (due) meta.push(`<span class="due ${due.overdue ? 'overdue' : due.today ? 'today' : ''}">${due.overdue ? '⚠ ' : '📅 '}${esc(due.label)}</span>`);
  if (repeatLabel(t)) meta.push(`<span title="繰り返し">🔁 ${esc(repeatLabel(t))}</span>`);
  if (t.note) meta.push('<span title="メモあり">📝 メモ</span>');
  if (subs.length) meta.push(`<button class="sub-toggle" data-act="sub-expand" data-id="${t.id}" aria-expanded="${open}">☑ ${subDone}/${subs.length} ${open ? '▾' : '▸'}</button>`);
  const ariaEdit = [t.title, due && `期限 ${due.label}${due.overdue ? '（期限切れ）' : ''}`, t.priority && `優先度${PRIO_LABEL[t.priority]}`, repeatLabel(t)].filter(Boolean).join('、') + ' を編集';
  const prio = t.priority ? `<span class="prio-dot p${t.priority}" title="優先度：${PRIO_LABEL[t.priority]}"></span><span class="sr-only">優先度${PRIO_LABEL[t.priority]}</span>` : '';
  return `<div class="task ${t.done ? 'done' : ''}" ${sortable ? 'data-sort-item' : ''} data-id="${t.id}" style="--c:${esc(l.color)}">
    <div class="swipe-bg" aria-hidden="true"><span class="sb-l">✓ ${t.done ? '未完了に戻す' : '完了'}</span><span class="sb-r">🗑 削除</span></div>
    <div class="task-body">
      <button class="chk" data-act="toggle" data-id="${t.id}" role="checkbox" aria-checked="${t.done}" aria-label="${esc(t.title)} を${t.done ? '未完了に戻す' : '完了にする'}"><i>${ICON.check}</i></button>
      <div class="task-col">
        <div class="task-main" data-act="edit-task" data-id="${t.id}" role="button" tabindex="0" aria-label="${esc(ariaEdit)}" title="Enterで編集／Alt+↑↓で並べ替え">
          <div class="task-title">${prio}<span class="tt">${esc(t.title)}</span></div>
          <div class="task-meta">${meta.join('')}</div>
        </div>
        ${subs.length && open ? `<div class="subs">${subs.map(s => `
          <div class="sub ${s.done ? 'done' : ''}"><button class="sub-chk" data-act="sub-toggle" data-id="${t.id}" data-sid="${s.id}" role="checkbox" aria-checked="${!!s.done}" aria-label="${esc(s.title)}"><i>${ICON.check}</i></button><span class="sub-t">${esc(s.title)}</span></div>`).join('')}</div>` : ''}
      </div>
      ${sortable ? `<div class="handle" aria-hidden="true" title="ドラッグで並べ替え">${ICON.grip}</div>` : ''}
    </div>
  </div>`;
}

/* ---------- 9-4. カレンダー（今日 / 週間 / 月間） ---------- */
/** カレンダー・予定カード共通の1行（回 = {t, date, done}） */
function instRow(x, { showDate = false, overdue = false, noTime = false } = {}) {
  const t = x.t, l = listById(t.listId);
  const today = dateKey();
  const late = !x.done && (overdue || (x.date === today && t.dueTime && t.dueTime < nowHM()) || x.date < today);
  const meta = [];
  if (showDate) {
    const dd = diffDays(today, x.date);
    meta.push(`<span class="${late ? 'late' : ''}">${dd === 0 ? '今日' : dd === -1 ? '昨日' : dd === 1 ? '明日' : fmtMD(x.date)}</span>`);
  }
  if (t.dueTime && !noTime) meta.push(`<span class="${late ? 'late' : ''}">${t.dueTime}</span>`);
  if (isRepeat(t)) meta.push(`<span>🔁</span>`);
  if (l.type === 'shopping' && t.quantity > 1) meta.push(`<span>×${t.quantity}</span>`);
  return `<div class="inst ${x.done ? 'done' : ''}" data-id="${t.id}" data-date="${x.date}" style="--c:${esc(l.color)}">
    <button class="chk" data-act="occ" data-id="${t.id}" data-date="${x.date}" role="checkbox" aria-checked="${x.done}"
      aria-label="${esc(t.title)}（${fmtMD(x.date)}）を${x.done ? '未完了に戻す' : '完了にする'}"><i>${ICON.check}</i></button>
    <button class="inst-main" data-act="edit-task" data-id="${t.id}">
      <span class="inst-ico" aria-hidden="true">${esc(l.type === 'shopping' ? itemIcon(t) : l.icon)}</span>
      <span class="inst-t">${t.priority ? `<span class="prio-dot p${t.priority}"></span>` : ''}${esc(t.title)}</span>
      ${meta.length ? `<span class="inst-meta">${meta.join(' ')}</span>` : ''}
    </button>
  </div>`;
}
const progBar = (done, total) => `<div class="pbar" role="img" aria-label="${done}/${total}件完了"><i style="width:${total ? Math.round(done / total * 100) : 0}%"></i></div>`;

function calTitle() {
  const m = S.settings.calMode, a = S.calAnchor, today = dateKey();
  if (m === 'today') return [a === today ? '今日' : fmtLong(a), a === today ? fmtLong(a) : `${diffDays(today, a) > 0 ? diffDays(today, a) + '日後' : -diffDays(today, a) + '日前'}`];
  if (m === 'week') { const s = startOfWeek(a), e = addDays(s, 6); return [`${fmtMD(s).replace(/\(.\)/, '')} – ${fmtMD(e).replace(/\(.\)/, '')}`, s <= today && today <= e ? '今週' : '']; }
  const [y, mo] = a.split('-').map(Number);
  return [`${y}年${mo}月`, ''];
}
function renderCalendar() {
  const m = S.settings.calMode;
  const [title, sub] = calTitle();
  const modes = [['today', '今日'], ['week', '週間'], ['month', '月間']];
  let html = `<header class="phead">
    <div class="ph-title"><h1>${esc(title)}</h1>${sub ? `<small>${esc(sub)}</small>` : ''}</div>
    <button class="icon-btn" data-act="cal-move" data-d="-1" aria-label="前へ">${ICON.back}</button>
    <button class="txt-btn" data-act="cal-today">今日</button>
    <button class="icon-btn" data-act="cal-move" data-d="1" aria-label="次へ"><span style="transform:scaleX(-1);display:inline-grid">${ICON.back}</span></button>
  </header>
  <div class="cal-modes"><div class="seg" role="group" aria-label="表示の切り替え">${modes.map(([k, v]) =>
    `<button data-act="cal-mode" data-m="${k}" aria-pressed="${m === k}">${v}</button>`).join('')}</div></div>`;
  html += m === 'today' ? renderDay(S.calAnchor) : m === 'week' ? renderWeek(S.calAnchor) : renderMonth(S.calAnchor);
  return html;
}

function renderDay(k) {
  const today = dateKey();
  const xs = instancesOn(k);
  const allDay = xs.filter(x => !x.t.dueTime);
  const timed = xs.filter(x => x.t.dueTime);
  const od = k === today ? overdueInstances() : [];
  const p = dayProgress(k);
  let html = `<div class="day">`;
  if (p.total) html += `<div class="day-prog"><span>${p.done}/${p.total}件完了</span>${progBar(p.done, p.total)}</div>`;
  if (od.length) html += `<section class="cal-sec od"><h3>⚠ 期限切れ ${od.length}件</h3>${od.map(x => instRow(x, { showDate: true, overdue: true })).join('')}</section>`;
  if (allDay.length) html += `<section class="cal-sec"><h3>終日</h3>${allDay.map(x => instRow(x)).join('')}</section>`;
  if (timed.length || k === today) {
    const now = nowHM();
    let rows = '', nowDone = k !== today;
    for (const x of timed) {
      if (!nowDone && x.t.dueTime > now) { rows += nowLine(now); nowDone = true; }
      rows += `<div class="tl-row"><div class="tl-time ${!x.done && k === today && x.t.dueTime < now ? 'late' : ''}">${x.t.dueTime}</div><div class="tl-card">${instRow(x, { noTime: true })}</div></div>`;
    }
    if (!nowDone) rows += nowLine(now);
    if (timed.length || od.length || allDay.length) html += `<section class="cal-sec"><h3>タイムライン</h3><div class="timeline">${rows}</div></section>`;
  }
  if (!xs.length && !od.length) html += `<div class="empty"><div class="big">🗓️</div><p>${k === today ? '今日' : fmtMD(k) + ' '}の予定はありません。<br>＋ から追加できます。</p></div>`;
  return html + `</div>`;
}
const nowLine = hm => `<div class="tl-now" aria-label="現在時刻 ${hm}"><span>${hm}</span><i></i></div>`;

function renderWeek(k) {
  const today = dateKey();
  const s = startOfWeek(k);
  let html = `<div class="week">`;
  for (let i = 0; i < 7; i++) {
    const d = addDays(s, i);
    const xs = instancesOn(d);
    const p = { total: xs.length, done: xs.filter(x => x.done).length };
    const wd = weekday(d);
    html += `<section class="wday ${d === today ? 'is-today' : ''} ${d < today ? 'past' : ''}">
      <button class="wd-head" data-act="cal-day" data-date="${d}" aria-label="${fmtLong(d)}を1日表示で開く">
        <b class="${wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''}">${+d.slice(8)}</b><span class="${wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''}">${WD[wd]}</span>
        <span class="wd-count">${p.total ? `${p.done}/${p.total}` : ''}</span></button>
      ${p.total ? progBar(p.done, p.total) : ''}
      <div class="wd-items">${xs.map(x => instRow(x)).join('') || '<p class="wd-empty">—</p>'}</div>
    </section>`;
  }
  return html + `</div>`;
}

function renderMonth(k) {
  const today = dateKey();
  const [y, m] = k.split('-').map(Number);
  const first = `${y}-${pad(m)}-01`;
  const start = startOfWeek(first);
  const ws = S.settings.weekStart ?? 1;
  let head = '';
  for (let i = 0; i < 7; i++) { const w = (ws + i) % 7; head += `<div class="${w === 0 ? 'sun' : w === 6 ? 'sat' : ''}">${WD[w]}</div>`; }
  let cells = '';
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    if (i === 35 && d.slice(0, 7) !== first.slice(0, 7)) break;   // 6行目が丸ごと翌月なら省く
    const xs = instancesOn(d);
    const inMonth = d.slice(0, 7) === first.slice(0, 7);
    // 件数の多いリストのアイコンを最大3つ
    const cnt = {};
    xs.forEach(x => { cnt[x.t.listId] = (cnt[x.t.listId] || 0) + 1; });
    const icons = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]).slice(0, 3).map(id => listById(id).icon).join('');
    const undone = xs.filter(x => !x.done).length, done = xs.length - undone;
    const dots = '<i class="dot"></i>'.repeat(Math.min(undone, 4)) + '<i class="dot done"></i>'.repeat(Math.min(done, Math.max(0, 4 - undone)));
    const more = xs.length > 4 ? `<small>+${xs.length - 4}</small>` : '';
    const wd = weekday(d);
    cells += `<button class="mcell ${inMonth ? '' : 'out'} ${d === today ? 'is-today' : ''} ${xs.length && !undone ? 'all-done' : ''}" data-act="cal-sheet" data-date="${d}"
      aria-label="${fmtLong(d)} 予定${xs.length}件${xs.length ? `（完了${done}件）` : ''}">
      <span class="mnum ${wd === 0 ? 'sun' : wd === 6 ? 'sat' : ''}">${+d.slice(8)}</span>
      <span class="micons" aria-hidden="true">${esc(icons)}</span>
      <span class="mdots" aria-hidden="true">${dots}${more}</span>
    </button>`;
  }
  return `<div class="month"><div class="mhead">${head}</div><div class="mgrid">${cells}</div></div>`;
}

/** 月間のセルをタップ → その日の詳細をボトムシートで */

  const body = () => {

    onMount(el) {

      $('.sheet-body', el).addEventListener('click', async e => {

        if (a.dataset.act === 'occ') { await toggleOccurrence(a.dataset.id, a.dataset.date); setTimeout(refresh, 480); }
        if (a.dataset.act === 'edit-task') openTaskEditor(a.dataset.id);
      });
      $('#ds-day', el).addEventListener('click', () => { closeSheet(true); S.settings.calMode = 'today'; S.calAnchor = k; render(true); saveSettings(); });
      $('#ds-add', el).addEventListener('click', () => { closeSheet(true); openQuickAdd({ date: k }); });
    },
  });
}
function calMove(dir) {
  const m = S.settings.calMode, a = S.calAnchor;
  if (m === 'today') S.calAnchor = addDays(a, dir);
  else if (m === 'week') S.calAnchor = addDays(a, 7 * dir);
  else {
    let [y, mo] = a.split('-').map(Number);
    mo += dir; if (mo < 1) { mo = 12; y--; } if (mo > 12) { mo = 1; y++; }
    S.calAnchor = `${y}-${pad(mo)}-01`;
  }
  render(true);
}

/* ---------- 9-5. ホームの「今日の予定」カード（起動時に最上部で分かるように） ---------- */
function renderAgenda() {

/* ---------- 9-6. 統計 ---------- */
/** タスクが完了した日（通常＝完了時刻の日付、繰り返し＝完了した回の日付） */
function completionDates(t) {
  return [...(t.doneDates || []), ...(t.done && t.doneAt ? [dateKey(t.doneAt)] : [])];
}
/** 削除するタスクの完了数を統計用に残す（sign=+1 退避 / -1 取り消し） */
async function archiveTasks(tasks, sign) {
  let changed = false;
  for (const t of tasks) for (const d of completionDates(t)) {
    const o = S.archive[d] || (S.archive[d] = {});
    o[t.listId] = (o[t.listId] || 0) + sign;
    if (o[t.listId] <= 0) delete o[t.listId];
    if (!Object.keys(o).length) delete S.archive[d];
    changed = true;
  }
  if (changed) await persist([{ store: 'kv', put: [{ key: 'archive', days: S.archive }] }], '統計の保存');
}
/** 日付ごと・リストごとの完了数 {日付: {listId: n}} */
function completionCounts() {
  const days = {};
  const add = (d, l, n) => { const o = days[d] || (days[d] = {}); o[l] = (o[l] || 0) + n; };
  for (const t of S.tasks) for (const d of completionDates(t)) add(d, t.listId, 1);
  for (const [d, o] of Object.entries(S.archive)) for (const [l, n] of Object.entries(o)) add(d, l, n);
  return days;
}
const sumDay = o => Object.values(o || {}).reduce((a, b) => a + b, 0);

/** その日の「予定」（期限日のあるタスクと繰り返しの回）を全部完了したか */
function dayPlan(k) {
  let total = 0, done = 0;
  for (const t of liveTasks()) {
    if (isRepeat(t)) { if (occursOn(t, k)) { total++; if (t.doneDates.includes(k)) done++; } }
    else if (t.dueDate === k) { total++; if (t.done) done++; }
  }
  return { total, done };
}
/** 連続達成日数。予定のない日は数えずに飛ばす（途切れない）。今日が未達でもまだ途切れない */
function streaks() {
  const today = dateKey();
  let run = 0, best = 0;
  const recent = [];
  for (let i = 365; i >= 0; i--) {
    const k = addDays(today, -i);
    const p = dayPlan(k);
    const state = !p.total ? 'none' : p.done === p.total ? 'ok' : k === today ? 'open' : 'miss';
    if (i < 14) recent.push({ k, state, ...p });
    if (state === 'ok') { run++; best = Math.max(best, run); }
    else if (state === 'miss') run = 0;
  }
  return { cur: run, best, recent };
}

function barChartSVG(data, W) {
  const H = 180, padL = 28, padR = 6, padT = 20, padB = 24;
  const n = data.length, max = Math.max(1, ...data.map(d => d.n));
  const ch = H - padT - padB, cw = (W - padL - padR) / n;
  const bw = Math.max(3, Math.min(30, cw - 2));   // 隣の棒との間に最低2pxのすき間
  const y0 = H - padB;
  const maxI = data.findIndex(d => d.n === max && max > 0);
  let g = `<line class="ch-grid" x1="${padL}" x2="${W - padR}" y1="${padT}" y2="${padT}"/>
    <text class="ch-axis" x="${padL - 6}" y="${padT + 4}" text-anchor="end">${max}</text>
    <text class="ch-axis" x="${padL - 6}" y="${y0 + 4}" text-anchor="end">0</text>`;
  data.forEach((d, i) => {
    const x = padL + i * cw + (cw - bw) / 2;
    const h = d.n / max * ch;
    if (h > 0) {
      const r = Math.min(4, bw / 2, h), y = y0 - h;
      g += `<path class="ch-bar" data-i="${i}" d="M${x},${y0} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${y0} Z"/>`;
    }
    // 数値は「最大」と「今日」だけに添える
    if (d.n > 0 && (i === maxI || i === n - 1)) g += `<text class="ch-val" x="${x + bw / 2}" y="${y0 - h - 5}" text-anchor="middle">${d.n}</text>`;
    const showX = n <= 7 || i === n - 1 || (n - 1 - i) % 5 === 0;
    if (showX) g += `<text class="ch-axis ${i === n - 1 ? 'today' : ''}" x="${x + bw / 2}" y="${H - 7}" text-anchor="middle">${n <= 7 ? `${+d.k.slice(8)}(${WD[weekday(d.k)]})` : `${+d.k.slice(5, 7)}/${+d.k.slice(8)}`}</text>`;
    g += `<rect class="ch-hit" data-i="${i}" x="${padL + i * cw}" y="${padT - 10}" width="${cw}" height="${ch + 10}"><title>${fmtMD(d.k)}：${d.n}件</title></rect>`;
  });
  g += `<line class="ch-base" x1="${padL}" x2="${W - padR}" y1="${y0}" y2="${y0}"/>`;
  return `<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="直近${n}日の完了数の棒グラフ">${g}</svg>`;
}

function renderStats() {
  const today = dateKey();
  const counts = completionCounts();
  const range = S.statRange;
  const series = Array.from({ length: range }, (_, i) => { const k = addDays(today, i - range + 1); return { k, n: sumDay(counts[k]) }; });
  const sumRange = r => Array.from({ length: r }, (_, i) => sumDay(counts[addDays(today, -i)])).reduce((a, b) => a + b, 0);
  const W = Math.max(280, Math.min(760, ($('#main').clientWidth || 360) - 64));
  const st = streaks();
  // リスト別（直近30日）
  const perList = {};
  for (let i = 0; i < 30; i++) for (const [l, n] of Object.entries(counts[addDays(today, -i)] || {})) perList[l] = (perList[l] || 0) + n;
  const lrows = sortedLists().map(l => ({ l, n: perList[l.id] || 0 })).filter(x => x.n).sort((a, b) => b.n - a.n);
  const lmax = Math.max(1, ...lrows.map(x => x.n));
  const stateLabel = { ok: '達成', miss: '未達', open: '進行中', none: '予定なし' };

  return `<header class="phead"><div class="ph-title"><h1>統計</h1><small>完了の記録</small></div></header>
  <div class="stats">
    <div class="stat-tiles">
      <div class="stat-tile"><span>今日</span><b>${sumDay(counts[today])}</b><small>件完了</small></div>
      <div class="stat-tile"><span>7日間</span><b>${sumRange(7)}</b><small>件完了</small></div>
      <div class="stat-tile"><span>30日間</span><b>${sumRange(30)}</b><small>件完了</small></div>
    </div>
    <section class="card chart-card">
      <div class="card-head"><h3>日ごとの完了数</h3>
        <div class="seg small-seg" role="group">${[7, 30].map(r => `<button data-act="stat-range" data-r="${r}" aria-pressed="${range === r}">${r}日</button>`).join('')}</div></div>
      <p class="ch-tip" id="ch-tip" aria-live="polite">棒をタップすると件数を表示します</p>
      <div class="chart-wrap">${barChartSVG(series, W)}</div>
      <table class="sr-only"><caption>直近${range}日の完了数</caption><tr><th>日付</th><th>件数</th></tr>
        ${series.map(d => `<tr><td>${fmtMD(d.k)}</td><td>${d.n}</td></tr>`).join('')}</table>
    </section>
    <section class="card">
      <div class="card-head"><h3>連続達成</h3></div>
      <div class="streak"><span class="fire" aria-hidden="true">🔥</span><b>${st.cur}</b><span>日連続</span><small>最長 ${st.best}日（直近1年）</small></div>
      <div class="streak-days" role="list" aria-label="直近14日の達成状況">${st.recent.map(d =>
        `<span role="listitem" class="sd ${d.state}" title="${fmtMD(d.k)}：${stateLabel[d.state]}${d.total ? `（${d.done}/${d.total}）` : ''}" aria-label="${fmtMD(d.k)} ${stateLabel[d.state]}">
          <i>${d.state === 'ok' ? '✓' : d.state === 'miss' ? '−' : d.state === 'open' ? '…' : ''}</i><small>${+d.k.slice(8)}</small></span>`).join('')}</div>
      <p class="hint" style="margin:8px 0 12px">期限日のある予定と繰り返しの回を、その日のうちにすべて完了した日を数えます。予定のない日は数えず、連続も途切れません。</p>
    </section>
    <section class="card">
      <div class="card-head"><h3>リスト別（30日間）</h3></div>
      ${lrows.length ? `<div class="lbars">${lrows.map(x => `<div class="lbar" style="--c:${esc(x.l.color)}">
        <span class="lb-name">${esc(x.l.icon)} ${esc(x.l.name)}</span>
        <span class="lb-track"><i style="width:${Math.max(2, x.n / lmax * 100)}%"></i></span><b>${x.n}</b></div>`).join('')}</div>`
        : '<p class="hint" style="margin:8px 0 14px">まだ完了した記録がありません。</p>'}
    </section>
  </div>`;
}

/* =====================================================================
   10. タスク操作（完了 / 削除 / サブタスク / 並べ替え）
   ===================================================================== */
/** 繰り返しタスクの回 k の完了/取り消し。繰り返しでなければ通常の toggleDone */
async function toggleOccurrence(id, k) {
  const t = taskById(id); if (!t) return;
  if (!isRepeat(t)) return toggleDone(id);
  k = k || t.dueDate;
  const before = clone(t);
  const wasAll = allDoneToday();
  const wasDone = t.doneDates.includes(k);
  if (wasDone) {
    t.doneDates = t.doneDates.filter(x => x !== k);
    if (k < t.dueDate) t.dueDate = k;            // 過去の回を戻したら、その回が「今回」になる
  } else {
    t.doneDates = [...t.doneDates, k].sort();
    if (k === t.dueDate) t.dueDate = advancePending(t, k);
  }
  $$(`.task[data-id="${id}"], .inst[data-id="${id}"][data-date="${k}"]`).forEach(r => {
    r.classList.toggle('done', !wasDone);
    const c = r.querySelector('.chk'); if (c) c.setAttribute('aria-checked', !wasDone);
  });
  const delay = wasDone || reduceMotion.matches ? 0 : 450;
  scheduleRender(delay);
  await saveTasks(t, '完了の保存');
  if (!wasDone) {
    const moved = t.dueDate !== before.dueDate ? ` → 次回 ${fmtMD(t.dueDate)}` : '';
    showUndo(`「${t.title}」${fmtMD(k)}分を完了${moved}`, async () => {
      Object.assign(t, before); render(); await saveTasks(t, '元に戻す');
    });
    if (!wasAll && allDoneToday()) setTimeout(celebrate, delay + 60);
  }
}

async function toggleDone(id) {
  const t = taskById(id); if (!t) return;
  if (isRepeat(t)) return toggleOccurrence(id, t.dueDate);
  const l = listById(t.listId);
  const before = clone(t);
  const wasAll = allDoneToday();
  t.done = !t.done;
  t.doneAt = t.done ? Date.now() : null;

  // 先に見た目だけ変えてアニメーションさせ、少し後に描き直す
  $$(`.inst[data-id="${id}"]`).forEach(r => r.classList.toggle('done', t.done));
  const rows = $$(`.task[data-id="${id}"]`);
  rows.forEach(r => { r.classList.toggle('done', t.done); const c = r.querySelector('.chk'); if (c) c.setAttribute('aria-checked', t.done); });
  const shop = l.type === 'shopping';
  let delay = 0;
  if (shop) {
    // 買い物：アイコンが縮んで消える
    if (t.done) { delay = reduceMotion.matches ? 0 : 420; $$(`.shop-item[data-id="${id}"]`).forEach(r => r.classList.add('bought')); }
  } else if (t.done && l.completeStyle === 'vanish') {
    delay = reduceMotion.matches ? 0 : 620;
    rows.forEach(r => { r.classList.add('vanishing'); setTimeout(() => collapse(r), 260); });
  } else if (l.completeStyle === 'strike') {
    delay = reduceMotion.matches ? 0 : 480;
  }
  scheduleRender(delay);
  await saveTasks(t, t.done ? '完了の保存' : '未完了への変更');
  if (shop) await recordPurchase(t, t.done ? 1 : -1);

  if (t.done) {
    showUndo(shop ? `「${t.title}」を購入済みにしました` : `「${t.title}」を完了しました`, async () => {
      Object.assign(t, before); render(); await saveTasks(t, '元に戻す');
      if (shop) await recordPurchase(t, -1);
    });
    if (!wasAll && allDoneToday()) setTimeout(celebrate, delay + 60);
  }
}

async function deleteTask(id, { animate = true } = {}) {
  const t = taskById(id); if (!t) return;
  S.tasks = S.tasks.filter(x => x !== t);
  if (animate) {
    $$(`.task[data-id="${id}"]`).forEach(r => collapse(r));
    $$(`.shop-item[data-id="${id}"]`).forEach(r => r.classList.add('bought'));
  }
  scheduleRender(animate && !reduceMotion.matches ? 340 : 0);
  showUndo(`「${t.title}」を削除しました`, async () => {
    S.tasks.push(t); render(); await saveTasks(t, '削除の取り消し'); await archiveTasks([t], -1);
  });
  await persist([{ store: 'tasks', del: [id] }], 'タスクの削除');
  await archiveTasks([t], 1);
}

async function clearDone(listId) {
  const done = tasksOf(listId).filter(t => t.done);
  if (!done.length) return;
  S.tasks = S.tasks.filter(t => !done.includes(t));
  render();
  const shop = listById(listId)?.type === 'shopping';
  showUndo(shop ? `購入済み ${done.length}品をクリアしました` : `完了済み ${done.length}件を削除しました`, async () => {
    S.tasks.push(...done); render(); await saveTasks(done, '削除の取り消し'); await archiveTasks(done, -1);
  });
  await persist([{ store: 'tasks', del: done.map(t => t.id) }], '完了済みの削除');
  await archiveTasks(done, 1);
}

/* ---------- 買い物：追加・数量・よく買う物 ---------- */
/** 同じ品名が未購入で残っていれば数量を足す。戻り値 {task, merged} */
function addShoppingItem(listId, title, { quantity = 1, ...extra } = {}) {
  const key = normName(title);
  const same = tasksOf(listId).find(t => !t.done && normName(t.title) === key);
  if (same) { same.quantity = Math.min(999, (same.quantity || 1) + quantity); return { task: same, merged: true }; }
  const h = S.history.find(x => x.name === key);
  const t = newTask(listId, title, { quantity, ...extra });
  if (h && h.icon && !t.icon) t.icon = h.icon;
  S.tasks.push(t);
  return { task: t, merged: false };
}
async function changeQty(id, d) {
  const t = taskById(id); if (!t) return;
  const q = Math.max(1, Math.min(999, (t.quantity || 1) + d));
  if (q === t.quantity) return;
  t.quantity = q; render(); await saveTasks(t, '数量の保存');
}
async function shopAddFromInput(listId) {
  const input = $('#shop-input');
  if (!input) return;
  const raw = input.value.trim();
  if (!raw) { input.focus(); return; }
  const p = parseQuick(raw, { listId });
  const target = listById(p.listId) || listById(listId);
  let res;
  if (target.type === 'shopping') res = addShoppingItem(target.id, p.title, { quantity: p.quantity, dueDate: p.dueDate, dueTime: p.dueTime, repeat: p.repeat, repeatDays: p.repeatDays });
  else { const t = newTask(target.id, p.title, { dueDate: p.dueDate, dueTime: p.dueTime, repeat: p.repeat, repeatDays: p.repeatDays }); S.tasks.push(t); res = { task: t }; }
  render();
  const again = $('#shop-input'); if (again) again.focus();   // 続けて入力できるように
  showToast(res.merged ? `「${res.task.title}」の数量を ×${res.task.quantity} にしました` : `「${res.task.title}」を${target.id === listId ? '' : ` ${target.icon}${target.name} に`}追加しました`);
  await saveTasks(res.task, '品目の追加');
}
async function freqAdd(listId, key) {
  const h = S.history.find(x => x.name === key); if (!h) return;
  const { task } = addShoppingItem(listId, h.label, h.icon ? { icon: h.icon } : {});
  render();
  showToast(`${h.icon || guessEmoji(h.label)} ${h.label} を追加しました`);
  await saveTasks(task, '品目の追加');
}
async function freqDelete(key) {
  const h = S.history.find(x => x.name === key); if (!h) return;
  S.history = S.history.filter(x => x !== h);
  render();
  showUndo(`「${h.label}」を候補から外しました`, async () => {
    S.history.push(h); render(); await persist([{ store: 'history', put: [h] }], '候補の復元');
  });
  await persist([{ store: 'history', del: [key] }], '候補の削除');
}

async function toggleSub(taskId, subId) {
  const t = taskById(taskId); if (!t) return;
  const s = t.subtasks.find(x => x.id === subId); if (!s) return;
  s.done = !s.done;
  render();
  await saveTasks(t, 'サブタスクの保存');
}

async function setPriority(id, p) {
  const t = taskById(id); if (!t) return;
  t.priority = p; render(); await saveTasks(t);
}
async function moveToTop(id) {
  const t = taskById(id); if (!t) return;
  t.order = tasksOf(t.listId).reduce((m, x) => Math.min(m, x.order ?? 0), 0) - 1;
  render(); await saveTasks(t);
}

/** ドラッグ並べ替えの確定 */
async function applyReorder(kind, ids) {
  if (kind === 'lists') {
    const changed = [];
    ids.forEach((id, i) => { const l = listById(id); if (l && l.order !== i) { l.order = i; changed.push(l); } });
    render();
    if (changed.length) await saveLists(changed, '並べ替えの保存');
  } else {
    const changed = [];
    ids.forEach((id, i) => { const t = taskById(id); if (t && t.order !== i) { t.order = i; changed.push(t); } });
    render();
    if (changed.length) await saveTasks(changed, '並べ替えの保存');
  }
}

/** 行を高さごと畳むアニメーション */
function collapse(el) {
  if (reduceMotion.matches) { el.style.display = 'none'; return; }
  el.style.height = el.offsetHeight + 'px';
  el.style.overflow = 'hidden';
  void el.offsetHeight;
  el.style.transition = 'height .3s ease, opacity .3s ease, margin .3s ease';
  el.style.height = '0px'; el.style.opacity = '0'; el.style.marginBottom = '-8px';
}

/* =====================================================================
   11. リスト操作
   ===================================================================== */
async function deleteList(id) {
  const l = listById(id); if (!l) return;
  const ts = tasksOf(id);
  const ok = await confirmDialog({
    title: `「${l.name}」を削除しますか？`,
    message: ts.length ? `中のタスク ${ts.length}件も一緒に削除されます。` : 'このリストにタスクはありません。',
    ok: '削除する', danger: true,
  });
  if (!ok) return;
  closeSheet(true);
  S.lists = S.lists.filter(x => x !== l);
  S.tasks = S.tasks.filter(t => t.listId !== id);
  if (S.route.view === 'list' && S.route.listId === id) go('#/'); else render();
  showUndo(`リスト「${l.name}」を削除しました`, async () => {
    S.lists.push(l); S.tasks.push(...ts); render(); await archiveTasks(ts, -1);
    await persist([{ store: 'lists', put: [l] }, { store: 'tasks', put: ts }], '削除の取り消し');
  });
  await persist([{ store: 'lists', del: [id] }, { store: 'tasks', del: ts.map(t => t.id) }], 'リストの削除');
  await archiveTasks(ts, 1);
}

/* =====================================================================
   12. シート（ボトムシート）・確認ダイアログ・右クリックメニュー
   ===================================================================== */
let sheetState = null;
/** シート／ダイアログが開いている間は背面を inert に（Tab や読み上げが背面へ行かない） */
function syncInert() {
  const dlg = !$('#dialogRoot').hidden, sh = !!sheetState;
  ['#main', '#nav'].forEach(sel => { $(sel).inert = dlg || sh; });
  $('#sheetRoot').inert = dlg && sh;
}
function openSheet({ title, body, foot = '', onMount, onClose }) {
  closeSheet(true);
  closeMenu();
  const root = $('#sheetRoot');
  const prevFocus = document.activeElement;
  root.innerHTML = `<div class="scrim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
      <div class="sheet-head"><h2 id="sheet-title">${esc(title)}</h2><button class="icon-btn" data-close aria-label="閉じる">${ICON.close}</button></div>
      <div class="sheet-body">${body}</div>
      ${foot ? `<div class="sheet-foot">${foot}</div>` : ''}
    </div>`;
  root.hidden = false;
  document.body.classList.add('sheet-open');
  const el = root.querySelector('.sheet');
  $$('[data-close]', root).forEach(b => b.addEventListener('click', () => closeSheet()));
  sheetState = { root, el, prevFocus, onClose };
  syncInert();
  if (onMount) onMount(el);   // iOSでキーボードを出すため、focus はここで同期的に行う
  if (!el.contains(document.activeElement)) el.focus({ preventScroll: true });
}
function closeSheet(silent = false) {
  if (!sheetState) return;
  const s = sheetState; sheetState = null;
  s.root.innerHTML = ''; s.root.hidden = true;
  document.body.classList.remove('sheet-open');
  syncInert();
  if (s.onClose) s.onClose();
  if (!silent && s.prevFocus && document.contains(s.prevFocus)) s.prevFocus.focus({ preventScroll: true });
}

let dialogResolve = null;
function confirmDialog({ title, message = '', ok = 'OK', cancel = 'キャンセル', danger = false, requireText = '' }) {
  return new Promise(resolve => {
    const root = $('#dialogRoot');
    const prev = document.activeElement;
    root.innerHTML = `<div class="scrim" data-v="0"></div>
      <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-m">
        <h3 id="dlg-t">${esc(title)}</h3><p id="dlg-m">${esc(message)}</p>
        ${requireText ? `<input class="inp" id="dlg-text" type="text" autocomplete="off" placeholder="${esc(requireText)}" aria-label="確認の文字" style="margin:-6px 0 16px">` : ''}
        <div class="row"><button class="btn" data-v="0">${esc(cancel)}</button><button class="btn ${danger ? 'danger-fill' : 'primary'}" data-v="1" ${requireText ? 'disabled' : ''}>${esc(ok)}</button></div>
      </div>`;
    root.hidden = false;
    syncInert();
    const finish = v => { root.hidden = true; root.innerHTML = ''; dialogResolve = null; syncInert(); if (prev && document.contains(prev)) prev.focus({ preventScroll: true }); resolve(v); };
    dialogResolve = finish;
    root.onclick = e => { const b = e.target.closest('[data-v]'); if (b && !b.disabled) finish(b.dataset.v === '1'); };
    const ti = root.querySelector('#dlg-text');
    if (ti) { ti.addEventListener('input', () => { root.querySelector('.btn[data-v="1"]').disabled = ti.value.trim() !== requireText; }); ti.focus(); }
    else root.querySelector('.btn[data-v="0"]').focus();
  });
}

function openMenu(x, y, items) {
  const m = $('#menu');
  m.innerHTML = items.map((it, i) => {
    if (it === '-') return '<hr>';
    if (it.prio !== undefined) return `<div class="menu-prio"><span>優先度</span>${[3, 2, 1, 0].map(p =>
      `<button role="menuitemradio" aria-checked="${it.prio === p}" data-p="${p}" aria-label="優先度${PRIO_LABEL[p]}">${p ? `<span class="prio-dot p${p}" style="margin:0"></span>` : '—'}</button>`).join('')}</div>`;
    return `<button role="menuitem" data-i="${i}" class="${it.danger ? 'danger' : ''}">${it.label}</button>`;
  }).join('');
  m.hidden = false;
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + 'px';
  m.onclick = e => {
    const p = e.target.closest('[data-p]');
    const b = e.target.closest('[data-i]');
    const prioItem = items.find(it => it.prio !== undefined);
    closeMenu();
    if (p && prioItem) prioItem.onPrio(+p.dataset.p);
    else if (b) items[+b.dataset.i].fn();
  };
  const first = m.querySelector('button'); if (first) first.focus({ preventScroll: true });
}
function closeMenu() { const m = $('#menu'); if (!m.hidden) { m.hidden = true; m.innerHTML = ''; } }

        <div style="display:flex;gap:10px;align-items:center">

        const w = +b.dataset.w;
        d.repeatDays = d.repeatDays.includes(w) ? d.repeatDays.filter(x => x !== w) : [...d.repeatDays, w];

  openSheet({
    title: '追加',
    body: `

/* =====================================================================
   14-2. 時刻になったら知らせる（アプリを開いている間だけ）
   iPhone Safari は閉じた状態での予約通知ができないため、サーバー通知は使わない。
   時刻を過ぎて10分以内の未完了の予定を、アプリ内アラート＋(許可があれば)通知で知らせる。
   ===================================================================== */
const LS_NOTIFIED = 'todotiles.notified';
let notified = { day: '', keys: new Set() };
const toMin = hm => +hm.slice(0, 2) * 60 + +hm.slice(3, 5);
function checkAlarms() {
  if (!S.ready) return;
  const today = dateKey(), hm = nowHM();
  if (notified.day !== today) {
    try { const o = JSON.parse(lsGet(LS_NOTIFIED) || '{}'); notified = { day: today, keys: new Set(o.day === today ? o.keys : []) }; }
    catch { notified = { day: today, keys: new Set() }; }
  }
  let changed = false;
  for (const x of instancesOn(today)) {
    if (x.done || !x.t.dueTime || x.t.dueTime > hm) continue;
    const key = `${x.t.id}|${x.t.dueTime}`;
    if (notified.keys.has(key)) continue;
    notified.keys.add(key); changed = true;
    if (toMin(hm) - toMin(x.t.dueTime) <= 10) fireAlarm(x);
  }
  if (changed) lsSet(LS_NOTIFIED, JSON.stringify({ day: today, keys: [...notified.keys] }));
}
function fireAlarm(x) {
  const t = x.t, l = listById(t.listId);
  const box = $('#alarms');
  const card = document.createElement('div');
  card.className = 'alarm';
  card.setAttribute('role', 'alert');
  card.style.setProperty('--c', l.color);
  card.innerHTML = `<div class="al-ico" aria-hidden="true">⏰</div>
    <div class="al-text"><b>${esc(t.dueTime)}</b> ${esc(t.title)}<small>${esc(l.icon)} ${esc(l.name)}</small></div>
    <button class="al-btn" data-al="done">完了</button><button class="al-x" data-al="close" aria-label="閉じる">✕</button>`;
  card.addEventListener('click', e => {
    const a = e.target.closest('[data-al]'); if (!a) return;
    if (a.dataset.al === 'done') toggleOccurrence(t.id, x.date);
    card.remove();
  });
  box.appendChild(card);
  try { if (navigator.vibrate && navigator.userActivation && navigator.userActivation.hasBeenActive) navigator.vibrate([200, 100, 200]); } catch { /* noop */ }
  // OSの通知（許可済みのときだけ）。iPhone はホーム画面に追加したアプリで、開いている間のみ
  if ('Notification' in window && Notification.permission === 'granted') {
    const title = `⏰ ${t.dueTime} ${t.title}`, opts = { body: `${l.icon} ${l.name}`, tag: `${t.id}|${t.dueTime}` };
    (async () => {
      try {
        const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
        if (reg) await reg.showNotification(title, opts); else new Notification(title, opts);
      } catch { try { new Notification(title, opts); } catch { /* 非対応 */ } }
    })();
  }
}
async function requestNotifyPermission() {
  if (!('Notification' in window)) { showToast('このブラウザは通知に対応していません（iPhoneはホーム画面に追加すると使えます）', 4000); return; }
  try { await Notification.requestPermission(); } catch { /* noop */ }
  render();
  showToast(Notification.permission === 'granted' ? '通知を許可しました' : '通知は許可されませんでした');
}

const stamp = () => { const p = tokyoParts(); return `${p.y}${pad(p.m)}${pad(p.d)}-${pad(p.h)}${pad(p.mi)}`; };
/** ファイルを保存させる。スマホでは共有シート（「ファイルに保存」など）を優先 */
async function saveFile(name, text, mime) {
  const blob = new Blob([text], { type: mime });
  const touch = matchMedia('(pointer: coarse)').matches;
  if (touch && navigator.canShare && window.File) {
    const file = new File([blob], name, { type: mime });
    if (navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return true; }
      catch (e) { if (e.name === 'AbortError') return false; /* 失敗時は通常のダウンロードへ */ }
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  return true;
}

/* ---- .ics（iPhone/Googleカレンダーなどに取り込める形式） ---- */
function icsEscape(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
/** 75オクテットごとに折り返す（UTF-8の文字の途中では切らない） */
function icsFold(line) {
  const enc = new TextEncoder();
  const out = []; let cur = '', bytes = 0;
  for (const ch of line) {
    const b = enc.encode(ch).length;
    if (bytes + b > (out.length ? 74 : 75)) { out.push(cur); cur = ''; bytes = 0; }
    cur += ch; bytes += b;
  }
  out.push(cur);
  return out.join('\r\n ');
}
const icsDate = k => k.replace(/-/g, '');
function buildICS({ alarm = true } = {}) {
  const BYDAY = ['SU', 'MO', 'TU', 'WE', 'TH', 'FR', 'SA'];
  const now = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//ToDoTiles//JA', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:ToDoTiles', 'X-WR-TIMEZONE:Asia/Tokyo',
    'BEGIN:VTIMEZONE', 'TZID:Asia/Tokyo', 'BEGIN:STANDARD', 'DTSTART:19700101T000000', 'TZOFFSETFROM:+0900', 'TZOFFSETTO:+0900', 'TZNAME:JST', 'END:STANDARD', 'END:VTIMEZONE'];
  let count = 0;
  for (const t of liveTasks()) {
    if (!t.dueDate || (t.done && !isRepeat(t))) continue;
    const l = listById(t.listId);
    L.push('BEGIN:VEVENT', `UID:${t.id}@todotiles`, `DTSTAMP:${now}`, `SUMMARY:${icsEscape(`${l.icon} ${t.title}`)}`);
    if (t.dueTime) {
      let [h, m] = t.dueTime.split(':').map(Number);
      let endDate = t.dueDate; m += 30; if (m >= 60) { m -= 60; h++; } if (h >= 24) { h -= 24; endDate = addDays(endDate, 1); }
      L.push(`DTSTART;TZID=Asia/Tokyo:${icsDate(t.dueDate)}T${t.dueTime.replace(':', '')}00`, `DTEND;TZID=Asia/Tokyo:${icsDate(endDate)}T${pad(h)}${pad(m)}00`);
    } else {
      L.push(`DTSTART;VALUE=DATE:${icsDate(t.dueDate)}`, `DTEND;VALUE=DATE:${icsDate(addDays(t.dueDate, 1))}`);
    }
    if (isRepeat(t)) {
      const base = t.repeatStart || t.dueDate;
      const rule = {
        daily: 'FREQ=DAILY',
        weekdays: 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR',
        weekly: `FREQ=WEEKLY;BYDAY=${BYDAY[weekday(base)]}`,
        custom: `FREQ=WEEKLY;BYDAY=${(t.repeatDays || []).map(d => BYDAY[d]).join(',')}`,
        monthly: `FREQ=MONTHLY;BYMONTHDAY=${+base.slice(8) === 31 ? -1 : +base.slice(8)}`,
      }[t.repeat];
      if (rule) L.push(`RRULE:${rule}`);
    }
    const desc = [`リスト：${l.name}`, t.note, ...(t.subtasks || []).map(s => `${s.done ? '☑' : '☐'} ${s.title}`)].filter(Boolean).join('\n');
    L.push(`DESCRIPTION:${icsEscape(desc)}`, `CATEGORIES:${icsEscape(l.name)}`);
    if (alarm && t.dueTime) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsEscape(t.title)}`, 'TRIGGER:-PT0M', 'END:VALARM');
    L.push('END:VEVENT');
    count++;
  }
  L.push('END:VCALENDAR');
  return { text: L.map(icsFold).join('\r\n') + '\r\n', count };
}
async function exportICS() {
  const alarm = $('#ics-alarm') ? $('#ics-alarm').checked : true;
  const { text, count } = buildICS({ alarm });
  if (!count) { showToast('期限日のある未完了の予定がありません'); return; }
  const ok = await saveFile(`todotiles-${stamp()}.ics`, text, 'text/calendar');
  if (ok) showToast(`${count}件の予定を書き出しました`);
}

/** 最終バックアップから7日以上たっていたら、ホームで控えめに促す */
function backupDue() {
  if (!S.tasks.length) return false;
  const now = Date.now(), DAY = 86400000;
  if ((S.settings.backupSnoozeUntil || 0) > now) return false;
  const since = S.settings.lastBackupAt || (S.meta && S.meta.initializedAt) || now;
  return now - since >= 7 * DAY;
}
function renderBackupNudge() {
  if (!backupDue()) return '';
  const days = S.settings.lastBackupAt ? Math.floor((Date.now() - S.settings.lastBackupAt) / 86400000) : null;
  return `<div class="nudge" role="note"><span>💾 ${days === null ? 'まだバックアップがありません' : `最後のバックアップから${days}日たちました`}</span>
    <button class="link-btn" data-act="export-json">書き出す</button><button class="link-btn muted" data-act="backup-snooze">あとで</button></div>`;
}

   14-4. PWA（Service Worker の登録と更新のお知らせ・ホーム画面用アイコン）
   ===================================================================== */
const ICON_SVG = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='#4f6bff'/><rect x='104' y='104' width='136' height='136' rx='32' fill='#fff'/><rect x='272' y='104' width='136' height='136' rx='32' fill='#fff' fill-opacity='.55'/><rect x='104' y='272' width='136' height='136' rx='32' fill='#fff' fill-opacity='.55'/><rect x='272' y='272' width='136' height='136' rx='32' fill='#fff' fill-opacity='.55'/><path d='M138 174l24 24 46-50' fill='none' stroke='#4f6bff' stroke-width='22' stroke-linecap='round' stroke-linejoin='round'/></svg>`;
/** iPhone のホーム画面用アイコン（PNG）を実行時に作って apple-touch-icon に設定 */
function setupAppleIcon() {
  const img = new Image();
  img.onload = () => {
    try {
      const c = document.createElement('canvas'); c.width = c.height = 180;
      const g = c.getContext('2d');
      g.fillStyle = '#4f6bff'; g.fillRect(0, 0, 180, 180);   // iOSは角を自動で丸めるので四角く塗る
      g.drawImage(img, 0, 0, 180, 180);
      const link = document.createElement('link');
      link.rel = 'apple-touch-icon'; link.href = c.toDataURL('image/png');
      document.head.appendChild(link);
    } catch { /* noop */ }
  };
  img.src = 'data:image/svg+xml,' + encodeURIComponent(ICON_SVG.replace("rx='112'", "rx='0'"));
  const fav = document.createElement('link');
  fav.rel = 'icon'; fav.type = 'image/svg+xml'; fav.href = 'data:image/svg+xml,' + encodeURIComponent(ICON_SVG);
  document.head.appendChild(fav);
}
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  // 開発中（localhost）は古いキャッシュを見ないよう登録しない。?sw=1 で強制
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) && !/[?&]sw=1/.test(location.search)) return;
  let hasController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    // 初回インストール（コントローラが無い→有る）では再読み込みしない。以降の更新では読み込み直す
    if (!hasController) { hasController = true; return; }
    if (reloading) return;
    reloading = true; location.reload();
  });
  navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then(reg => {
    const offer = w => { if (w && navigator.serviceWorker.controller) showUpdateBar(w); };
    if (reg.waiting) offer(reg.waiting);
    reg.addEventListener('updatefound', () => {
      const w = reg.installing; if (!w) return;
      w.addEventListener('statechange', () => { if (w.state === 'installed') offer(w); });
    });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
  }).catch(e => console.warn('SW登録に失敗', e));
}
function showUpdateBar(worker) {
  const b = $('#updbar');
  b.innerHTML = `<span>✨ 新しいバージョンがあります</span><button data-u="go">更新する</button><button data-u="later" aria-label="あとで">✕</button>`;
  b.hidden = false;
  b.onclick = e => {
    const k = e.target.closest('[data-u]')?.dataset.u;
    if (k === 'go') { b.innerHTML = '<span>更新しています…</span>'; worker.postMessage({ type: 'SKIP_WAITING' }); }
    if (k === 'later') b.hidden = true;
  };
}

/* =====================================================================
   15. ジェスチャ：ドラッグ並べ替え（.handle をつかむ）
   タスク行・ホームのタイル（編集モード）共通。PC はマウス、スマホはタッチ。
   ===================================================================== */
let drag = null;
let suppressClickUntil = 0;

function scrollerOf(el) {
  const pane = el.closest('.pane');
  return ($('#main').classList.contains('split') && pane) ? pane : null;   // null = window
}
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const h = e.target.closest('.handle');
  if (!h) return;
  const el = h.closest('[data-sort-item]');
  if (!el || !el.parentElement.dataset.sort) return;
  e.preventDefault();
  drag = { el, container: el.parentElement, handle: h, pid: e.pointerId, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, started: false, raf: 0, scroller: scrollerOf(el) };
});
document.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.pid) return;
  drag.x = e.clientX; drag.y = e.clientY;
  if (!drag.started) {
    if (Math.hypot(drag.x - drag.x0, drag.y - drag.y0) < 5) return;
    drag.started = true;
    try { drag.handle.setPointerCapture(drag.pid); } catch { /* noop */ }
    drag.el.classList.add('dragging');
    document.body.classList.add('is-dragging');
    closeMenu();
    const loop = () => { if (!drag) return; autoScroll(); dragHitTest(); drag.raf = requestAnimationFrame(loop); };
    drag.raf = requestAnimationFrame(loop);
  }
  e.preventDefault();
}, { passive: false });
function dragHitTest() {
  const { x, y, el, container } = drag;
  const hit = document.elementsFromPoint(x, y).map(n => n.closest && n.closest('[data-sort-item]')).find(n => n && n !== el && n.parentElement === container);
  if (!hit) return;
  const items = [...container.children];
  const after = items.indexOf(hit) > items.indexOf(el);
  const r = hit.getBoundingClientRect(), er = el.getBoundingClientRect();
  const sameRow = Math.abs(r.top - er.top) < r.height / 2;
  // 相手の中心を越えたときだけ入れ替える（高さの違う行でのちらつき防止）
  const passed = sameRow ? (after ? x > r.left + r.width / 2 : x < r.left + r.width / 2)
                         : (after ? y > r.top + r.height / 2 : y < r.top + r.height / 2);
  if (passed) { if (after) hit.after(el); else hit.before(el); }
}
function autoScroll() {
  const s = drag.scroller;
  const top = s ? s.getBoundingClientRect().top : 0;
  const bottom = s ? s.getBoundingClientRect().bottom : innerHeight;
  const edge = 70, bottomEdge = bottom - (s ? 60 : 60 + 80);   // 下はナビの分だけ余裕を取る
  let v = 0;
  if (drag.y < top + edge) v = -Math.ceil((top + edge - drag.y) / 6);
  else if (drag.y > bottomEdge) v = Math.ceil((drag.y - bottomEdge) / 6);
  if (v) { if (s) s.scrollTop += v; else window.scrollBy(0, v); }
}
function endDrag(cancel) {
  if (!drag) return;
  const d = drag; drag = null;
  cancelAnimationFrame(d.raf);
  if (!d.started) return;
  d.el.classList.remove('dragging');
  document.body.classList.remove('is-dragging');
  suppressClickUntil = Date.now() + 350;
  const ids = [...d.container.children].filter(c => c.hasAttribute('data-sort-item')).map(c => c.dataset.id);
  if (cancel) render(); else applyReorder(d.container.dataset.sort, ids);
}
document.addEventListener('pointerup', e => { if (drag && e.pointerId === drag.pid) endDrag(false); });
document.addEventListener('pointercancel', e => { if (drag && e.pointerId === drag.pid) endDrag(false); });

/* =====================================================================
   16. ジェスチャ：スワイプ（左＝削除 / 右＝完了）
   ===================================================================== */
let sw = null;
const SWIPE_TH = 90;
document.addEventListener('pointerdown', e => {
  if (drag) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  const body = e.target.closest('.task-body');
  if (!body || e.target.closest('.handle, .chk, .sub-chk, .sub-toggle')) return;
  sw = { body, row: body.closest('.task'), pid: e.pointerId, x0: e.clientX, y0: e.clientY, dx: 0, active: false };
});
document.addEventListener('pointermove', e => {
  if (!sw || e.pointerId !== sw.pid) return;
  const dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
  if (!sw.active) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; }
    if (Math.abs(dx) < 12 || Math.abs(dx) < Math.abs(dy) * 1.3) return;
    sw.active = true;
    try { sw.body.setPointerCapture(sw.pid); } catch { /* noop */ }
    sw.row.classList.add('swiping');
    closeMenu();
  }
  // しきい値を超えたら少し重くする
  const lim = SWIPE_TH + 40;
  const x = Math.abs(dx) > lim ? Math.sign(dx) * (lim + (Math.abs(dx) - lim) * .3) : dx;
  sw.dx = dx;
  sw.body.style.transform = `translateX(${x}px)`;
  sw.row.dataset.swipe = dx < 0 ? 'left' : 'right';
  sw.row.classList.toggle('armed', Math.abs(dx) > SWIPE_TH);
});
function endSwipe(commit) {
  if (!sw) return;
  const s = sw; sw = null;
  if (!s.active) return;
  suppressClickUntil = Date.now() + 350;
  const id = s.row.dataset.id;
  if (commit && s.dx <= -SWIPE_TH) {
    s.body.style.transition = 'transform .2s ease';
    s.body.style.transform = 'translateX(-110%)';
    setTimeout(() => deleteTask(id), 180);
    return;
  }
  s.body.style.transform = '';
  setTimeout(() => { s.row.classList.remove('swiping', 'armed'); delete s.row.dataset.swipe; }, 220);
  if (commit && s.dx >= SWIPE_TH) toggleDone(id);
}
document.addEventListener('pointerup', e => { if (sw && e.pointerId === sw.pid) endSwipe(true); });
document.addEventListener('pointercancel', e => { if (sw && e.pointerId === sw.pid) endSwipe(false); });

/* =====================================================================
   17. クリック・右クリック・キーボードの振り分け
   ===================================================================== */
document.addEventListener('click', e => {
  if (Date.now() < suppressClickUntil) { e.stopPropagation(); e.preventDefault(); return; }
}, true);

document.addEventListener('click', e => {
  const m = $('#menu');
  if (!m.hidden && !m.contains(e.target)) closeMenu();
  const a = e.target.closest('[data-act]');
  if (!a || a.closest('#sheetRoot, #dialogRoot, #menu')) return;
  const id = a.dataset.id;
  switch (a.dataset.act) {
    case 'nav': go(a.dataset.to); break;
    case 'fab': openQuickAdd({ date: S.route.view === 'calendar' && S.calAnchor !== dateKey() && S.settings.calMode === 'today' ? S.calAnchor : null }); break;
    case 'theme': cycleTheme(); break;
    case 'home-edit': S.homeEdit = !S.homeEdit; render(); break;
    case 'open-list': if (S.homeEdit) openListEditor(id); else go('#/list/' + id); break;
    case 'add-list': openListEditor(); break;
    case 'back': goBack(); break;
    case 'list-settings': openListEditor(id); break;
    case 'toggle': toggleDone(id); break;
    case 'edit-task': openTaskEditor(id); break;
    case 'sub-expand': if (S.expanded.has(id)) S.expanded.delete(id); else S.expanded.add(id); render(); break;
    case 'sub-toggle': toggleSub(id, a.dataset.sid); break;
    case 'history': if (S.historyOpen.has(id)) S.historyOpen.delete(id); else S.historyOpen.add(id); render(); break;
    case 'clear-done': clearDone(id); break;
    case 'occ': toggleOccurrence(id, a.dataset.date); break;
    case 'cal-move': calMove(+a.dataset.d); break;
    case 'cal-today': S.calAnchor = dateKey(); render(true); break;
    case 'cal-mode': S.settings.calMode = a.dataset.m; render(true); saveSettings(); break;
    case 'cal-day': S.settings.calMode = 'today'; S.calAnchor = a.dataset.date; render(true); saveSettings(); break;
    case 'cal-sheet': openDaySheet(a.dataset.date); break;
    case 'cal-open-today': S.settings.calMode = 'today'; S.calAnchor = dateKey(); go('#/calendar'); saveSettings(); break;
    case 'notify-perm': requestNotifyPermission(); break;
    case 'stat-range': S.statRange = +a.dataset.r; render(); break;
    case 'export-json': exportJSON(); break;
    case 'import-json': pickImportFile(); break;
    case 'export-ics': exportICS(); break;
    case 'delete-all': deleteAllData(); break;
    case 'backup-snooze': S.settings.backupSnoozeUntil = Date.now() + 3 * 86400000; render(); saveSettings(); break;
    case 'buy': toggleDone(id); break;
    case 'qty': changeQty(id, +a.dataset.d); break;
    case 'shop-add': shopAddFromInput(id); break;
    case 'freq-add': freqAdd(id, a.dataset.key); break;
    case 'freq-del': freqDelete(a.dataset.key); break;
    case 'freq-edit': S.freqEdit = !S.freqEdit; render(); break;
    case 'freq-all': S.freqAll = !S.freqAll; render(); break;
    case 'set': {
      const k = a.dataset.k; let v = a.dataset.v;
      if (k === 'weekStart') v = +v;
      S.settings[k] = v;
      if (k === 'theme') applyTheme();
      render(); saveSettings();
      break;
    }
  }
});

// 統計グラフ：棒に触れる／タップで件数を表示
function chartTip(e) {
  const hit = e.target.closest && e.target.closest('.ch-hit'); if (!hit) return;
  const svg = hit.closest('svg'); const i = hit.dataset.i;
  const d = completionCounts(); const k = addDays(dateKey(), +i - S.statRange + 1);
  $$('.ch-bar', svg).forEach(b => b.classList.toggle('dim', b.dataset.i !== i));
  const tip = $('#ch-tip'); if (tip) tip.textContent = `${fmtMD(k)}：${sumDay(d[k])}件 完了`;
}
document.addEventListener('pointerover', chartTip);
document.addEventListener('click', chartTip);
document.addEventListener('pointerout', e => { if (e.target.closest && e.target.closest('.chart') && !e.relatedTarget?.closest?.('.chart')) $$('.ch-bar.dim').forEach(b => b.classList.remove('dim')); });

// PC：右クリックメニュー（Android の長押しでも開く）
document.addEventListener('contextmenu', e => {
  const row = e.target.closest('.task[data-id], .shop-item[data-id], .bought-chip[data-id]');
  const tile = e.target.closest('.tile[data-id]');
  if (!row && !tile) return;
  e.preventDefault();
  if (row) {
    const t = taskById(row.dataset.id); if (!t) return;
    const shop = listById(t.listId)?.type === 'shopping';
    openMenu(e.clientX, e.clientY, [
      { label: '✏️ 編集', fn: () => openTaskEditor(t.id) },
      { label: t.done ? (shop ? '↩️ 未購入に戻す' : '↩️ 未完了に戻す') : (shop ? '✅ 購入済みにする' : '✅ 完了にする'), fn: () => toggleDone(t.id) },
      { prio: t.priority, onPrio: p => setPriority(t.id, p) },
      { label: '⤒ 一番上へ', fn: () => moveToTop(t.id) },
      '-',
      { label: '🗑 削除', danger: true, fn: () => deleteTask(t.id) },
    ]);
  } else {
    const id = tile.dataset.id;
    openMenu(e.clientX, e.clientY, [
      { label: '📂 開く', fn: () => go('#/list/' + id) },
      { label: '✏️ リストを編集', fn: () => openListEditor(id) },
      '-',
      { label: '🗑 リストを削除', danger: true, fn: () => deleteList(id) },
    ]);
  }
});

/** キーボードでの並べ替え（Alt+↑↓←→）。ドラッグできない人向けの代替手段 */
async function keyboardMove(item, key) {
  const box = item.parentElement;
  const items = [...box.children].filter(c => c.hasAttribute('data-sort-item'));
  const i = items.indexOf(item);
  const j = i + (key === 'ArrowUp' || key === 'ArrowLeft' ? -1 : 1);
  if (j < 0 || j >= items.length) return;
  if (j < i) items[j].before(item); else items[j].after(item);
  const id = item.dataset.id, kind = box.dataset.sort;
  const ids = [...box.children].filter(c => c.hasAttribute('data-sort-item')).map(c => c.dataset.id);
  await applyReorder(kind, ids);
  const el = $(`[data-sort="${kind}"] [data-sort-item][data-id="${id}"] :is(.task-main, .tile-main)`);
  if (el) el.focus();
  const name = kind === 'lists' ? listById(id)?.name : taskById(id)?.title;
  showToast(`「${name}」を ${j + 1}番目に移動しました`);
}

document.addEventListener('keydown', e => {
  // role="button" の要素は Enter / Space で押せるように
  const rb = e.target.closest && e.target.closest('[role="button"][data-act]');
  if (rb && e.target === rb && (e.key === 'Enter' || e.key === ' ') && !isComposingEnter(e)) { e.preventDefault(); rb.click(); return; }
  if (e.altKey && /^Arrow(Up|Down|Left|Right)$/.test(e.key)) {
    const item = e.target.closest && e.target.closest('[data-sort-item]');
    if (item && item.parentElement.dataset.sort) { e.preventDefault(); keyboardMove(item, e.key); return; }
  }
  // 買い物リスト上部の入力欄（日本語変換中の Enter は無視）
  if (e.target.id === 'shop-input' && e.key === 'Enter' && !isComposingEnter(e)) {
    e.preventDefault(); shopAddFromInput(e.target.dataset.list); return;
  }
  if (e.key === 'Escape') {
    if (dialogResolve) { dialogResolve(false); return; }
    if (!$('#menu').hidden) { closeMenu(); return; }
    if (sheetState) { closeSheet(); return; }
    if (S.homeEdit) { S.homeEdit = false; render(); return; }
  }
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '');
  if (!typing && !sheetState && !dialogResolve && !e.ctrlKey && !e.metaKey && !e.altKey && (e.key === 'n' || e.key === 'N')) {
    e.preventDefault(); openQuickAdd();
  }
});
window.addEventListener('resize', closeMenu);
let resizeTimer = 0;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (S.route.view === 'stats') render(); }, 200); });
window.addEventListener('scroll', closeMenu, { passive: true });

/* =====================================================================
   18. iPhone のキーボード対策（シートをキーボードの上に出す）
   ===================================================================== */
if (window.visualViewport) {
  const vv = window.visualViewport;
  const onVV = () => {
    const kb = Math.max(0, innerHeight - vv.height - vv.offsetTop);
    document.documentElement.style.setProperty('--kb', kb + 'px');
    document.documentElement.style.setProperty('--vvh', vv.height + 'px');
  };
  vv.addEventListener('resize', onVV); vv.addEventListener('scroll', onVV); onVV();
}

/* =====================================================================
   19. 起動
   ===================================================================== */
let lastTick = { day: dateKey(), hm: nowHM() };
function tick() {
  checkAlarms();
  const day = dateKey(), hm = nowHM();
  if (day === lastTick.day && hm === lastTick.hm) return;
  if (day !== lastTick.day && S.calAnchor === lastTick.day) S.calAnchor = day;   // 日付が変わったらカレンダーも今日へ
  const typing = document.activeElement && document.activeElement.matches('#main input, #main textarea');
  if (typing) return;   // 入力中（買い物の追加欄など）は描き直さない。次の tick で更新
  lastTick = { day, hm };
  if (!sheetState && $('#menu').hidden && !drag && !sw) render();   // 日付・期限切れ表示の更新
}
isWide.addEventListener('change', () => render());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tick(); });

async function init() {
  applyTheme();
  try {
    await loadAll();
  } catch (e) {
    console.error(e);
    $('#paneA').innerHTML = `<div class="placeholder"><div><div class="big">⚠️</div>
      <p><b>データを読み込めませんでした</b></p><p style="font-size:13px">${esc(e && e.name || '')} ${esc(e && e.message || e)}</p>
      <p style="font-size:13px">プライベートブラウズでは保存できない場合があります。</p>
      <button class="btn primary" onclick="location.reload()">再読み込み</button></div></div>`;
    return;
  }
  S.ready = true;
  applyTheme();
  S.calAnchor = dateKey();
  S.route = parseHash();
  render();
  requestPersist();
  checkAlarms();
  setupAppleIcon();
  registerSW();
  setInterval(tick, 20000);
}
init();
</script>
