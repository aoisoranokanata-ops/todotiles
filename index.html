<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4f7">
<meta name="format-detection" content="telephone=no">
<title>ToDoTiles</title>
<style>
/* =====================================================================
   1. デザイントークン（ライト / ダーク）
   ===================================================================== */
:root {
  --bg: #f3f4f7; --surface: #ffffff; --surface2: #eceef2; --text: #1b1d22; --muted: #6b7280;
  --line: #e2e4e9; --accent: #4f6bff; --accent-soft: #e6eaff; --ok: #1f9d63; --danger: #e0484d; --warn: #e8900c;
  --ring-bg: #e6e8ee; --toast: #23262d; --toast-link: #9db4ff;
  --shadow: 0 1px 2px rgba(20,24,40,.06), 0 4px 14px rgba(20,24,40,.06);
  --shadow-lg: 0 10px 40px rgba(20,24,40,.22);
  --p1: #3b82f6; --p2: #f59e0b; --p3: #ef4444;
  --nav-h: 64px; --kb: 0px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --surface: #1b1e24; --surface2: #262a33; --text: #e8eaed; --muted: #9aa1ab;
    --line: #2e333c; --accent: #7d95ff; --accent-soft: #252c47; --ok: #3cc585; --danger: #ff6b6f; --warn: #ffb03b;
    --ring-bg: #2c313b; --toast: #3a3f4a; --toast-link: #b4c5ff;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
    --shadow-lg: 0 10px 40px rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --surface: #1b1e24; --surface2: #262a33; --text: #e8eaed; --muted: #9aa1ab;
  --line: #2e333c; --accent: #7d95ff; --accent-soft: #252c47; --ok: #3cc585; --danger: #ff6b6f; --warn: #ffb03b;
  --ring-bg: #2c313b; --toast: #3a3f4a; --toast-link: #b4c5ff;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.25);
  --shadow-lg: 0 10px 40px rgba(0,0,0,.6);
  color-scheme: dark;
}

/* =====================================================================
   2. ベース
   ===================================================================== */
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  font-size: 15px; line-height: 1.5; -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2.5px solid var(--accent); outline-offset: 2px;
}
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
svg.ico { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* =====================================================================
   3. レイアウト（スマホ1カラム / PC 2カラム）
   ===================================================================== */
#main { max-width: 720px; margin: 0 auto; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px); }
#paneB { display: none; }
@media (min-width: 900px) {
  #main.split { max-width: 1440px; display: grid; grid-template-columns: minmax(380px, 5fr) 6fr; height: 100vh; height: 100dvh; padding-bottom: 0; }
  #main.split .pane { height: 100vh; height: 100dvh; overflow-y: auto; padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px); }
  #main.split #paneB { display: block; border-left: 1px solid var(--line); }
  #main.split .back-btn { display: none; }
}

/* ペイン上部のヘッダー */
.phead {
  position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 4px;
  min-height: 56px; padding: calc(env(safe-area-inset-top) + 6px) max(8px, env(safe-area-inset-right)) 6px max(8px, env(safe-area-inset-left));
  background: var(--bg); background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.ph-title { flex: 1; min-width: 0; padding-left: 8px; display: flex; flex-direction: column; line-height: 1.25; }
.ph-title b { font-size: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ph-title small { color: var(--muted); font-size: 12.5px; }
.ph-list { display: flex; align-items: center; gap: 10px; flex-direction: row; }
.ph-list .ph-emoji { font-size: 28px; line-height: 1; }
.icon-btn { min-width: 44px; min-height: 44px; display: inline-grid; place-items: center; border: 0; background: none; border-radius: 12px; padding: 0; }
.icon-btn:hover { background: var(--surface2); }
.txt-btn { min-height: 44px; padding: 0 14px; border: 0; background: none; color: var(--accent); font-weight: 700; border-radius: 12px; }
.txt-btn:hover { background: var(--accent-soft); }
.txt-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }

/* =====================================================================
   4. ボトムナビ（片手操作用：主要ボタンは下部）
   ===================================================================== */
#nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background: var(--surface); background: color-mix(in srgb, var(--surface) 92%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-top: 1px solid var(--line);
}
#nav .nav-in { max-width: 560px; height: var(--nav-h); margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.nav-btn { height: 100%; min-height: 44px; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--muted); }
.nav-btn[aria-current="page"] { color: var(--accent); font-weight: 700; }
.fab {
  justify-self: center; width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
  display: grid; place-items: center; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 45%, transparent); transform: translateY(-14px);
  transition: transform .15s;
}
.fab:active { transform: translateY(-14px) scale(.94); }
.fab svg.ico { width: 30px; height: 30px; stroke-width: 2.6; }

/* =====================================================================
   5. ホーム：今日の達成度（ヒーロー）とタイル
   ===================================================================== */
.hero { display: flex; align-items: center; gap: 18px; margin: 4px 16px 18px; padding: 18px; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); }
.hero-ring { position: relative; width: 112px; height: 112px; flex: none; }
.hero-ring .ring-fg { stroke: var(--accent); }
.hero.all-done .hero-ring .ring-fg { stroke: var(--ok); }
.hero-pct { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
.hero-pct small { font-size: 14px; font-weight: 700; margin-left: 1px; }
.hero-label { font-size: 13px; color: var(--muted); font-weight: 600; }
.hero-count { font-size: 18px; margin: 2px 0 8px; }
.hero-count b { font-size: 30px; }
.chips-row { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--surface2); color: var(--muted); }
.chip.danger { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.hero.celebrate .hero-ring { animation: pop .7s ease; }
@keyframes pop { 40% { transform: scale(1.1); } 100% { transform: scale(1); } }

.hint { margin: -6px 16px 12px; font-size: 13px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; padding: 0 16px; }
@media (min-width: 600px) { .tiles { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); } }
.tile { position: relative; border-radius: 22px; background: var(--surface); box-shadow: var(--shadow); min-height: 156px; }
.tile-main {
  width: 100%; height: 100%; min-height: 156px; border: 0; background: none; border-radius: 22px; padding: 16px 10px 14px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center;
}
.tile-main:hover { background: color-mix(in srgb, var(--c) 6%, transparent); }
.tile.sel { box-shadow: 0 0 0 2.5px var(--c), var(--shadow); }
.tile-icon { position: relative; width: 80px; height: 80px; }
.tile-icon .ring-fg { stroke: var(--c); }
.tile-emoji { position: absolute; inset: 0; display: grid; place-items: center; font-size: 38px; line-height: 1; }
.tile-badge { position: absolute; right: -2px; bottom: 0; width: 24px; height: 24px; border-radius: 50%; background: var(--c); color: #fff; font-size: 14px; font-weight: 800; display: grid; place-items: center; border: 2px solid var(--surface); }
.tile-name { font-weight: 700; font-size: 16px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile-sub { font-size: 12.5px; color: var(--muted); }
.tile-sub b { color: var(--text); font-size: 14px; }
.tile-grip { position: absolute; top: 4px; left: 4px; width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); border-radius: 12px; touch-action: none; cursor: grab; }
.tile-edit { position: absolute; top: 10px; right: 12px; font-size: 13px; color: var(--muted); }
.tiles.editing .tile { outline: 2px dashed color-mix(in srgb, var(--c) 55%, transparent); outline-offset: -2px; }
.add-tile { border: 2px dashed var(--line); background: none; box-shadow: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 32px; border-radius: 22px; min-height: 156px; }
.add-tile span { font-size: 13px; font-weight: 600; }
.add-tile:hover { border-color: var(--accent); color: var(--accent); }

/* 進捗リング */
.ring { display: block; }
.ring-bg { stroke: var(--ring-bg); }
.ring-fg { transition: stroke-dashoffset .5s ease; }

/* =====================================================================
   6. リスト画面・タスク行
   ===================================================================== */
.list-summary { margin: 0 20px 12px; font-size: 13px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.tasks { display: flex; flex-direction: column; gap: 8px; padding: 0 12px; }
.task { position: relative; border-radius: 16px; overflow: hidden; --c: var(--accent); }
.swipe-bg { position: absolute; inset: 0; display: none; align-items: center; padding: 0 22px; color: #fff; font-weight: 700; }
.task.swiping .swipe-bg { display: flex; }
.task[data-swipe="left"] .swipe-bg { background: var(--danger); justify-content: flex-end; }
.task[data-swipe="right"] .swipe-bg { background: var(--ok); justify-content: flex-start; }
.task[data-swipe="left"] .sb-r, .task[data-swipe="right"] .sb-l { display: inline; }
.sb-l, .sb-r { display: none; }
.task.armed .swipe-bg span { transform: scale(1.15); }
.task-body {
  position: relative; display: flex; align-items: flex-start; min-height: 56px; background: var(--surface); border-radius: 16px; box-shadow: var(--shadow);
  touch-action: pan-y; -webkit-user-select: none; user-select: none; transition: transform .22s ease, opacity .25s ease;
}
.task.swiping .task-body { transition: none; }
.chk { flex: none; width: 50px; min-height: 56px; border: 0; background: none; display: grid; place-items: center; padding: 0; }
.chk i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--c); display: grid; place-items: center; transition: background .2s, transform .2s; }
.chk i svg { width: 16px; height: 16px; stroke: #fff; stroke-width: 3.2; fill: none; stroke-linecap: round; stroke-linejoin: round; transform: scale(0); transition: transform .2s cubic-bezier(.3,1.6,.6,1); }
.task.done .chk i { background: var(--c); }
.task.done .chk i svg { transform: scale(1); }
.chk:active i { transform: scale(.88); }
.task-col { flex: 1; min-width: 0; }
.task-main { padding: 15px 4px 13px 0; cursor: pointer; }
.task-title { font-size: 16px; line-height: 1.45; word-break: break-word; }
.tt { -webkit-box-decoration-break: clone; box-decoration-break: clone; background: linear-gradient(currentColor, currentColor) no-repeat 0 58% / 0 1.5px; transition: background-size .3s ease, color .3s; }
.prio-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
.prio-dot.p1 { background: var(--p1); } .prio-dot.p2 { background: var(--p2); } .prio-dot.p3 { background: var(--p3); }
.task-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 3px; font-size: 12.5px; color: var(--muted); }
.task-meta:empty { display: none; }
.due.today { color: var(--accent); font-weight: 700; }
.due.overdue { color: var(--danger); font-weight: 700; }
.sub-toggle { min-height: 44px; margin: -12px 0 -14px -8px; padding: 0 8px; border: 0; background: none; color: var(--muted); font-size: 12.5px; border-radius: 10px; }
.sub-toggle:hover { color: var(--text); }
.handle { flex: none; width: 44px; align-self: stretch; min-height: 56px; display: grid; place-items: center; color: var(--muted); touch-action: none; cursor: grab; opacity: .7; }
.handle svg { width: 20px; height: 20px; fill: currentColor; stroke: none; }
.subs { padding: 0 8px 8px 0; margin-top: -4px; }
.sub { display: flex; align-items: center; min-height: 44px; }
.sub-chk { flex: none; width: 40px; min-height: 44px; border: 0; background: none; display: grid; place-items: center; margin-left: -8px; }
.sub-chk i { width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--muted); display: grid; place-items: center; }
.sub-chk i svg { width: 12px; height: 12px; stroke: #fff; stroke-width: 3.4; fill: none; opacity: 0; }
.sub.done .sub-chk i { background: var(--c); border-color: var(--c); }
.sub.done .sub-chk i svg { opacity: 1; }
.sub.done .sub-t { color: var(--muted); text-decoration: line-through; }
.sub-t { font-size: 14.5px; word-break: break-word; }

/* 完了スタイル別の見た目 */
.style-strike .task.done .tt { background-size: 100% 1.5px; color: var(--muted); }
.style-strike .task.done .task-body { box-shadow: none; background: color-mix(in srgb, var(--surface) 60%, transparent); }
.style-check .task.done .task-main { opacity: .5; }
.style-check .task.done .task-body { box-shadow: none; }
.style-vanish .task.done .tt { color: var(--muted); }
.task.vanishing .task-body { opacity: 0; transform: translateX(40px); transition: opacity .3s ease, transform .3s ease; }

.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 22px 20px 8px; font-size: 13px; font-weight: 700; color: var(--muted); }
.sec-head .txt-btn { font-size: 13px; min-height: 44px; padding: 0 10px; }
.sec-toggle { min-height: 44px; border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 13px; padding: 0 4px; display: inline-flex; align-items: center; gap: 6px; }
.empty { margin: 36px 24px; text-align: center; color: var(--muted); }
.empty .big { font-size: 52px; line-height: 1.2; }
.empty p { margin: 8px 0 0; }
.placeholder { display: grid; place-items: center; min-height: 60vh; text-align: center; color: var(--muted); padding: 24px; }
.placeholder .big { font-size: 64px; }

/* ドラッグ並べ替え中 */
.dragging { z-index: 10; opacity: .92; transform: scale(1.03); box-shadow: var(--shadow-lg) !important; border-radius: 16px; }
.dragging .task-body { box-shadow: none; }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; -webkit-user-select: none; user-select: none; }

/* =====================================================================
   7. ボトムシート・ダイアログ・メニュー
   ===================================================================== */
#sheetRoot, #dialogRoot { position: relative; z-index: 50; }
#dialogRoot { z-index: 55; }
.scrim { position: fixed; inset: 0; background: rgba(10,12,18,.42); animation: fade .2s ease; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: var(--kb); margin: 0 auto; max-width: 640px;
  max-height: calc(100vh - env(safe-area-inset-top) - 24px); max-height: calc(var(--vvh, 100dvh) - env(safe-area-inset-top) - 16px);
  display: flex; flex-direction: column; background: var(--surface); border-radius: 22px 22px 0 0;
  padding-bottom: env(safe-area-inset-bottom); box-shadow: var(--shadow-lg); animation: up .24s cubic-bezier(.2,.9,.3,1); outline: none;
}
@media (min-width: 900px) { .sheet { bottom: auto; top: 8vh; border-radius: 22px; max-height: 84vh; animation: fade .18s ease; } }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px 8px 4px 20px; }
.sheet-head h2 { flex: 1; margin: 0; font-size: 17px; }
.sheet-body { overflow-y: auto; padding: 4px 20px 16px; overscroll-behavior: contain; }
.sheet-foot { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); }
.sheet-foot .sp { flex: 1; }
@keyframes up { from { transform: translateY(100%); } }
@keyframes fade { from { opacity: 0; } }

.dialog { position: fixed; left: 16px; right: 16px; top: 50%; transform: translateY(-50%); margin: 0 auto; max-width: 400px; background: var(--surface); border-radius: 20px; padding: 22px 20px 16px; box-shadow: var(--shadow-lg); animation: fade .15s; }
.dialog h3 { margin: 0 0 8px; font-size: 17px; }
.dialog p { margin: 0 0 18px; color: var(--muted); white-space: pre-wrap; }
.dialog .row { display: flex; gap: 10px; justify-content: flex-end; }

/* フォーム部品 */
.field { display: block; margin: 14px 0; }
.field > span, .field-label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
.inp, select.inp, textarea.inp {
  width: 100%; min-height: 46px; font: inherit; font-size: 16px; padding: 10px 12px; color: var(--text);
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface2); -webkit-appearance: none; appearance: none;
}
textarea.inp { resize: vertical; min-height: 80px; }
select.inp { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 36px; }
.inp:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row2 .field { margin: 0; }
.seg { display: flex; background: var(--surface2); border-radius: 13px; padding: 3px; gap: 3px; }
.seg button { flex: 1; min-height: 44px; border: 0; background: none; border-radius: 10px; font-size: 14px; padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); box-shadow: var(--shadow); font-weight: 700; }
.seg-note { font-size: 12.5px; color: var(--muted); margin: 6px 2px 0; }
.btn { min-height: 48px; padding: 0 20px; border: 0; border-radius: 14px; background: var(--surface2); font-weight: 700; }
.btn.primary { background: var(--accent); color: #fff; }
.btn.danger { background: none; color: var(--danger); }
.btn.danger-fill { background: var(--danger); color: #fff; }
.btn:disabled { opacity: .45; }
.link-btn { border: 0; background: none; color: var(--accent); font-weight: 600; min-height: 44px; padding: 0 6px; }
.emoji-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); gap: 4px; margin-top: 8px; }
.emoji-grid button { min-height: 44px; border: 0; background: var(--surface2); border-radius: 10px; font-size: 22px; }
.emoji-grid button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent) inset; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatches button { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.swatches button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--text); }
.icon-preview { display: flex; align-items: center; gap: 12px; }
.icon-preview .big { width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; font-size: 34px; background: color-mix(in srgb, var(--c) 16%, transparent); flex: none; }
.te-subs .sub-edit { display: flex; align-items: center; gap: 4px; margin-bottom: 6px; }
.te-subs .sub-edit .inp { min-height: 44px; }
.te-subs .sub-edit.done .inp { text-decoration: line-through; color: var(--muted); }
.qa-row { display: flex; gap: 8px; }
.qa-row .inp { flex: 1; }
.list-chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 2px 4px; scrollbar-width: none; }
.list-chips button { flex: none; min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: none; font-size: 14px; white-space: nowrap; }
.list-chips button[aria-pressed="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); font-weight: 700; }
.qa-fb { min-height: 22px; margin-top: 8px; font-size: 13px; color: var(--ok); }
.qa-parse { min-height: 44px; margin-top: 10px; }
.qa-hint { margin: 0; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.qa-title { font-size: 14px; color: var(--muted); margin-bottom: 6px; word-break: break-word; }
.qa-title b { color: var(--text); }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { min-height: 44px; padding: 0 12px; border-radius: 999px; border: 0; background: var(--accent-soft); color: var(--accent); font-size: 13.5px; font-weight: 700; }
.pchip.off { background: var(--surface2); color: var(--muted); text-decoration: line-through; font-weight: 500; }
.pchip.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); cursor: default; }

/* =====================================================================
   6-2. 買い物モード
   ===================================================================== */
.shop-add { display: flex; gap: 8px; padding: 0 12px 12px; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; padding: 0 12px; }
.shop-item {

.shop-main:hover { background: color-mix(in srgb, var(--c) 7%, transparent); }

.shop-edit:hover { opacity: 1; background: var(--surface2); }
.shop-qty { display: flex; align-items: center; justify-content: space-between; }
.shop-qty span { font-weight: 800; font-size: 14px; min-width: 18px; text-align: center; }

#menu button:hover, #menu button:focus-visible { background: var(--surface2); outline: none; }
#menu button.danger { color: var(--danger); }
#menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
#menu .menu-prio { display: flex; gap: 4px; padding: 2px 6px; align-items: center; }
#menu .menu-prio span { font-size: 12px; color: var(--muted); margin-right: 4px; }

/* =====================================================================
   8. 設定画面
   ===================================================================== */

.card { background: var(--surface); border-radius: 18px; padding: 4px 16px; box-shadow: var(--shadow); margin-bottom: 16px; }
.card h3 { font-size: 13px; color: var(--muted); margin: 14px 0 0; }

/* =====================================================================
   9. トースト・エラーバー・達成アニメーション
   ===================================================================== */
#toast {
  position: fixed; left: 12px; right: 12px; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px); z-index: 60;
  max-width: 520px; margin: 0 auto; min-height: 52px; padding: 4px 6px 4px 16px; display: flex; align-items: center; gap: 8px;
  background: var(--toast); color: #fff; border-radius: 14px; box-shadow: var(--shadow-lg); overflow: hidden;
  opacity: 0; transform: translateY(16px); pointer-events: none; transition: opacity .2s, transform .2s;
}

body.sheet-open #toast { bottom: calc(var(--kb) + env(safe-area-inset-bottom) + 12px); }
.toast-msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
.toast-btn { flex: none; min-height: 44px; padding: 0 14px; border: 0; background: none; color: var(--toast-link); font-weight: 800; border-radius: 10px; }
.toast-bar { position: absolute; left: 0; bottom: 0; height: 3px; width: 100%; background: var(--toast-link); transform-origin: left; animation: shrink 5s linear forwards; }
@keyframes shrink { to { transform: scaleX(0); } }

#errbar {
  position: fixed; left: 0; right: 0; top: 0; z-index: 70; display: flex; align-items: center; gap: 6px;
  padding: calc(env(safe-area-inset-top) + 8px) 8px 8px 16px; background: var(--danger); color: #fff; font-size: 14px; font-weight: 600; box-shadow: var(--shadow-lg);
}
#errbar span { flex: 1; }
#errbar button { min-height: 44px; min-width: 44px; border: 1.5px solid rgba(255,255,255,.7); background: none; color: #fff; border-radius: 10px; padding: 0 12px; font-weight: 700; }

#celebrate { position: fixed; inset: 0; z-index: 45; pointer-events: none; overflow: hidden; }
.cele-msg {
  position: absolute; left: 50%; top: calc(env(safe-area-inset-top) + 90px); transform: translateX(-50%);
  padding: 10px 20px; border-radius: 999px; background: var(--ok); color: #fff; font-weight: 800; white-space: nowrap; box-shadow: var(--shadow-lg);
  animation: celeMsg 2.8s ease forwards;
}
.cele-bit { position: absolute; bottom: -40px; font-size: 26px; animation: rise 2.4s ease-out forwards; }
@keyframes celeMsg { 0% { opacity: 0; transform: translate(-50%, -12px); } 12%, 80% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; } }
@keyframes rise { to { transform: translateY(-75vh) rotate(var(--rot)); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .cele-bit { display: none; }
  .toast-bar { display: none; }
}

<script>
'use strict';
/* =====================================================================
   ToDoTiles — フェーズ1
   データ層(IndexedDB) / ホームのタイル / リスト画面 / 完了スタイル3種 / 元に戻す
   ===================================================================== */
const APP_VERSION = '0.2.0';
const DB_NAME = 'todotiles';
const DB_VER = 1;
const LS_THEME = 'todotiles.theme';   // 起動時のちらつき防止用（本体の設定は IndexedDB）

/* =====================================================================
   1. 汎用ユーティリティ
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
const isWide = matchMedia('(min-width: 900px)');
const isComposingEnter = e => e.isComposing || e.keyCode === 229;   // 日本語変換確定のEnterを除外
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch { /* プライベートモード等 */ } }
function firstGrapheme(s) {
  s = String(s || '').trim();
  if (!s) return '';
  if (window.Intl && Intl.Segmenter) {
    const it = new Intl.Segmenter('ja', { granularity: 'grapheme' }).segment(s)[Symbol.iterator]().next();
    return it.value ? it.value.segment : '';
  }
  return Array.from(s).slice(0, 2).join('');
}

/* =====================================================================
   2. 日付ユーティリティ（Asia/Tokyo 固定）
   日付は "YYYY-MM-DD" 文字列で扱い、計算は UTC の暦日として行う。
   → 端末のタイムゾーンや UTC 変換による「前日化」が起きない。
   ===================================================================== */
const TZ = 'Asia/Tokyo';
const WD = '日月火水木金土';
const _dtf = new Intl.DateTimeFormat('en-US', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
const pad = n => String(n).padStart(2, '0');
function tokyoParts(ms = Date.now()) {
  const o = {};
  for (const p of _dtf.formatToParts(new Date(ms))) o[p.type] = p.value;
  return { y: +o.year, m: +o.month, d: +o.day, h: (+o.hour) % 24, mi: +o.minute };
}
function dateKey(ms = Date.now()) { const p = tokyoParts(ms); return `${p.y}-${pad(p.m)}-${pad(p.d)}`; }
function nowHM() { const p = tokyoParts(); return `${pad(p.h)}:${pad(p.mi)}`; }
function keyToUTC(k) { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d); }
function utcToKey(t) { const d = new Date(t); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }
function addDays(k, n) { return utcToKey(keyToUTC(k) + n * 86400000); }
function diffDays(a, b) { return Math.round((keyToUTC(b) - keyToUTC(a)) / 86400000); }   // b - a
function weekday(k) { return new Date(keyToUTC(k)).getUTCDay(); }
function fmtMD(k) { const [, m, d] = k.split('-').map(Number); return `${m}/${d}(${WD[weekday(k)]})`; }
function fmtLong(k) { const [, m, d] = k.split('-').map(Number); return `${m}月${d}日(${WD[weekday(k)]})`; }

/* =====================================================================
   3. IndexedDB ラッパー（自作）
   stores: lists / tasks(index: listId) / history(買い物履歴, フェーズ2) / kv(設定・メタ)
   すべて Promise を返す。失敗は reject され、呼び出し側で画面にエラーを出す。
   ===================================================================== */
const DB = {
  db: null,
  open() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('このブラウザは IndexedDB に対応していません'));
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VER); } catch (e) { return reject(e); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains('lists')) db.createObjectStore('lists', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('tasks')) db.createObjectStore('tasks', { keyPath: 'id' }).createIndex('listId', 'listId');
        if (!db.objectStoreNames.contains('history')) db.createObjectStore('history', { keyPath: 'name' });
        if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv', { keyPath: 'key' });
      };
      req.onsuccess = () => {
        this.db = req.result;
        this.db.onversionchange = () => {
          this.db.close(); this.db = null;
          showError('新しいバージョンが別のタブで開かれました。このタブを再読み込みしてください。');
        };
        resolve(this.db);
      };
      req.onerror = () => reject(req.error || new Error('データベースを開けませんでした'));
      req.onblocked = () => reject(new Error('他のタブがデータベースを使用中です。他のタブを閉じてから再読み込みしてください。'));
    });
  },
  /** 汎用トランザクション。work(tx) の中でリクエストを発行し、完了(oncomplete)で resolve */
  _tx(stores, mode, work) {
    return new Promise((resolve, reject) => {
      if (!this.db) return reject(new Error('データベースが開かれていません'));
      let tx;
      try { tx = this.db.transaction(stores, mode); } catch (e) { return reject(e); }
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error || new Error('書き込みエラー'));
      tx.onabort = () => reject(tx.error || new Error('トランザクションが中断されました'));
      try { work(tx); } catch (e) { try { tx.abort(); } catch { /* 既に終了 */ } reject(e); }
    });
  },
  async getAll(store) {
    let req;
    await this._tx(store, 'readonly', tx => { req = tx.objectStore(store).getAll(); });
    return req.result;
  },
  /** 複数ストアへの一括書き込み（原子的）。ops: [{store, put:[...], del:[...], clear:bool}] */
  write(ops) {
    const stores = [...new Set(ops.map(o => o.store))];
    return this._tx(stores, 'readwrite', tx => {
      for (const o of ops) {
        const os = tx.objectStore(o.store);
        if (o.clear) os.clear();
        for (const v of (o.put || [])) os.put(v);
        for (const k of (o.del || [])) os.delete(k);
      }
    });
  },
};

/* =====================================================================
   4. アプリ状態とモデル
   ===================================================================== */
const COLORS = ['#4f6bff', '#22a06b', '#f59e0b', '#e0484d', '#a855f7', '#14b8a6', '#ec4899', '#64748b'];
const EMOJIS = ['🛒', '🏠', '💼', '📚', '⭐', '🍳', '🧺', '🧹', '💊', '🏃', '💰', '🧾', '✈️', '🚗', '🐶', '🌱', '🎮', '🎵', '🎁', '🔧', '📝', '❤️', '👶', '🎓'];
const STYLE_INFO = {
  vanish: { label: '消える', desc: 'フェードアウトして一覧から消えます（「完了履歴」から確認できます）' },
  strike: { label: '取り消し線', desc: '取り消し線を引いて文字を残し、下部に移動します' },
  check:  { label: 'チェック', desc: '文字はその場に残し、チェックマークと薄い色で表示します' },
};
const PRIO_LABEL = ['なし', '低', '中', '高'];
const DEFAULT_SETTINGS = { key: 'settings', theme: 'system', weekStart: 1, defaultCompleteStyle: 'strike', lastListId: null, lastBackupAt: null };
const DEFAULT_LISTS = [
  ['買い物', '🛒', '#22a06b', 'shopping', 'vanish'],
  ['家事',   '🏠', '#f59e0b', 'todo', 'check'],
  ['仕事',   '💼', '#4f6bff', 'todo', 'strike'],
  ['勉強',   '📚', '#a855f7', 'todo', 'check'],
  ['その他', '⭐', '#64748b', 'todo', 'strike'],
];

const S = {
  lists: [], tasks: [], history: [], settings: { ...DEFAULT_SETTINGS },
  route: { view: 'home' },
  homeEdit: false,
  expanded: new Set(),       // サブタスクを開いているタスクID
  historyOpen: new Set(),    // 完了履歴を開いているリストID
  persisted: null,           // navigator.storage.persist() の結果
  ready: false,
};

const listById = id => S.lists.find(l => l.id === id);
const taskById = id => S.tasks.find(t => t.id === id);
const sortedLists = () => [...S.lists].sort(byOrder);
const tasksOf = listId => S.tasks.filter(t => t.listId === listId);
const liveTasks = () => S.tasks.filter(t => listById(t.listId));
function nextOrder(listId) { return tasksOf(listId).reduce((m, t) => Math.max(m, t.order ?? 0), -1) + 1; }

function newTask(listId, title, extra = {}) {
  return {
    id: uid(), listId, title, note: '', dueDate: null, dueTime: null, priority: 0,
    repeat: 'none', subtasks: [], done: false, doneAt: null, doneDates: [],
    createdAt: Date.now(), order: nextOrder(listId), quantity: 1, ...extra,
  };
}
function newList(extra = {}) {
  return {
    id: uid(), name: '', icon: '📝', color: COLORS[S.lists.length % COLORS.length], type: 'todo',
    completeStyle: S.settings.defaultCompleteStyle || 'strike',
    order: S.lists.reduce((m, l) => Math.max(m, l.order ?? 0), -1) + 1, ...extra,
  };
}

/** 「今日分」の集計
 *  対象 = 未完了で期限が今日以前(または期限なし)のタスク ＋ 今日完了したタスク
 *  （未来の期限のタスクは今日分に含めない） */
function todayStats(tasks) {
  const today = dateKey();
  let total = 0, done = 0;
  for (const t of tasks) {
    if (t.done) { if (t.doneAt && dateKey(t.doneAt) === today) { total++; done++; } }
    else if (!t.dueDate || t.dueDate <= today) total++;
  }
  return { total, done, pct: total ? done / total : 0 };
}
function allDoneToday() { const s = todayStats(liveTasks()); return s.total > 0 && s.done === s.total; }

/** 期限の表示情報 */
function dueInfo(t) {
  if (!t.dueDate) return null;
  const today = dateKey();
  const d = diffDays(today, t.dueDate);
  let label = d === 0 ? '今日' : d === 1 ? '明日' : d === 2 ? '明後日' : d === -1 ? '昨日' : fmtMD(t.dueDate);
  if (t.dueTime) label += ' ' + t.dueTime;
  const overdue = !t.done && (d < 0 || (d === 0 && !!t.dueTime && t.dueTime < nowHM()));
  return { label, overdue, today: d === 0 };
}
function relDate(k) {
  const d = diffDays(dateKey(), k);
  return d === 0 ? `今日 ${fmtMD(k)}` : d === 1 ? `明日 ${fmtMD(k)}` : d === 2 ? `明後日 ${fmtMD(k)}` : fmtMD(k);
}

/** 繰り返しの表示名（展開・日付ごとの完了はフェーズ3） */
const REPEAT_LABEL = { none: 'なし', daily: '毎日', weekdays: '平日', weekly: '毎週', monthly: '毎月' };
function repeatLabel(t) {
  if (!t.repeat || t.repeat === 'none') return '';
  if (t.repeat === 'weekly' && t.dueDate) return `毎週${WD[weekday(t.dueDate)]}曜`;
  if (t.repeat === 'monthly' && t.dueDate) return `毎月${+t.dueDate.slice(8)}日`;
  return REPEAT_LABEL[t.repeat] || '';
}

/* =====================================================================
   4-2. 買い物：品名→絵文字の簡易辞書・よく買う物の履歴
   ===================================================================== */

    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
    .replace(/\s+/g, '');
}

function guessEmoji(name) {
  const n = normName(name);
  if (!n) return '🛒';
  for (const [e, words] of EMOJI_DICT) if (words.some(w => n.includes(w))) return e;

/** 購入回数の記録（delta: +1 購入 / -1 取り消し） */
async function recordPurchase(t, delta) {
  const key = normName(t.title);
  if (!key) return;
  let h = S.history.find(x => x.name === key);
  if (!h) { if (delta < 0) return; h = { name: key, label: t.title, icon: t.icon || '', count: 0, lastBoughtAt: 0 }; S.history.push(h); }
  h.count = Math.max(0, h.count + delta);
  if (delta > 0) { h.lastBoughtAt = Date.now(); h.label = t.title; if (t.icon) h.icon = t.icon; }
  if (h.count === 0) {
    S.history = S.history.filter(x => x !== h);
    await persist([{ store: 'history', del: [key] }], '購入履歴の保存');
  } else {
    await persist([{ store: 'history', put: [h] }], '購入履歴の保存');
  }
}
/** よく買う物の候補（購入回数順、いま未購入で入っている物は除く） */
function frequentItems(listId) {
  const inList = new Set(tasksOf(listId).filter(t => !t.done).map(t => normName(t.title)));
  return S.history.filter(h => h.count > 0 && !inList.has(h.name))
    .sort((a, b) => b.count - a.count || b.lastBoughtAt - a.lastBoughtAt);
}

/* =====================================================================
   4-3. クイック追加の日本語解析
   認識: 今日/明日/明後日/N日後/来週/(来週|今週|再来週)X曜/X曜/9/30/9月30日/2026/9/30/月末
         15時/15時30分/15時半/15:30/午前・午後・朝・夜・夕方
         毎日/平日/毎週(X曜)/毎月(N日)/#リスト名/×2(数量)/2個・2本など(買い物リストのみ)
   解析結果は chips として返し、入力欄の下に表示する。
   skip に含めた種類は「認識したが使わない」（チップをタップで切替）。
   ===================================================================== */
const WD_IDX = { 日: 0, 月: 1, 火: 2, 水: 3, 木: 4, 金: 5, 土: 6 };
const SUF = '(?:までに|まで|に|の)?';
function startOfWeek(k) { const ws = S.settings.weekStart ?? 1; return addDays(k, -((weekday(k) - ws + 7) % 7)); }
function nextWeekday(from, wd) { return addDays(from, (wd - weekday(from) + 7) % 7); }
function ymd(y, m, d) {
  if (!(m >= 1 && m <= 12 && d >= 1)) return null;
  if (d > new Date(Date.UTC(y, m, 0)).getUTCDate()) return null;
  return `${y}-${pad(m)}-${pad(d)}`;
}
function monthDay(y, m, d) {   // 月の日数で丸める（毎月31日→30日の月は30日）
  const dim = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return `${y}-${pad(m)}-${pad(Math.min(d, dim))}`;
}
function findListByTag(name) {
  const n = normName(name);
  const ls = sortedLists();
  return ls.find(l => normName(l.name) === n)
    || ls.find(l => normName(l.name).startsWith(n))
    || ls.find(l => normName(l.name).includes(n));
}

function parseQuick(raw, { listId = null, skip = new Set() } = {}) {
  let s = ' ' + String(raw).replace(/[０-９：／＃]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)) + ' ';
  const today = dateKey();
  const r = { title: '', listId, dueDate: null, dueTime: null, repeat: 'none', quantity: 1, chips: [] };
  const seen = new Set();
  let repeatWd = null, repeatDay = null;

  /** 1つの規則：最初に一致した部分を認識。handler が {label, apply} を返せば採用 */
  const rule = (kind, re, handler) => {
    if (seen.has(kind)) return;
    const m = s.match(re);
    if (!m) return;
    const res = handler(m);
    if (!res) return;
    seen.add(kind);
    const off = skip.has(kind) && !res.warn;
    r.chips.push({ kind, label: res.label, off, warn: !!res.warn });
    if (off || res.warn) return;
    if (res.apply) res.apply();
    s = s.replace(m[0], (m.groups && m.groups.pre || '') + ' ');
  };

  // --- リスト指定 #名前 ---
  rule('list', /[#＃]([^\s#＃]+)/, m => {
    const l = findListByTag(m[1]);
    if (!l) return { label: `#${m[1]}：該当リストなし`, warn: true };
    return { label: `📂 ${l.icon} ${l.name}`, apply: () => { r.listId = l.id; } };
  });
  const target = listById(r.listId);

  // --- 繰り返し ---
  rule('repeat', new RegExp('毎週\\s?の?([日月火水木金土])曜日?' + SUF), m => ({ label: `🔁 毎週${m[1]}曜`, apply: () => { r.repeat = 'weekly'; repeatWd = WD_IDX[m[1]]; } }));
  rule('repeat', new RegExp('毎月\\s?(\\d{1,2})日' + SUF), m => (+m[1] >= 1 && +m[1] <= 31) ? { label: `🔁 毎月${+m[1]}日`, apply: () => { r.repeat = 'monthly'; repeatDay = +m[1]; } } : null);
  rule('repeat', new RegExp('毎?平日' + SUF), () => ({ label: '🔁 平日', apply: () => { r.repeat = 'weekdays'; } }));
  rule('repeat', new RegExp('毎日' + SUF), () => ({ label: '🔁 毎日', apply: () => { r.repeat = 'daily'; } }));
  rule('repeat', new RegExp('毎週' + SUF), () => ({ label: '🔁 毎週', apply: () => { r.repeat = 'weekly'; } }));
  rule('repeat', new RegExp('毎月' + SUF), () => ({ label: '🔁 毎月', apply: () => { r.repeat = 'monthly'; } }));

  // --- 日付 ---
  const dateRes = k => k ? { label: `📅 ${relDate(k)}`, apply: () => { r.dueDate = k; } } : null;
  const [ty, tm] = today.split('-').map(Number);
  const futureMD = (m, d) => { let k = ymd(ty, m, d); if (k && k < today) k = ymd(ty + 1, m, d); return k; };
  rule('date', new RegExp('(\\d{4})[/\\-年](\\d{1,2})[/\\-月](\\d{1,2})日?' + SUF), m => dateRes(ymd(+m[1], +m[2], +m[3])));
  rule('date', new RegExp('(?<pre>^|\\D)(\\d{1,2})/(\\d{1,2})(?!\\d)' + SUF), m => dateRes(futureMD(+m[2], +m[3])));
  rule('date', new RegExp('(\\d{1,2})月(\\d{1,2})日' + SUF), m => dateRes(futureMD(+m[1], +m[2])));
  rule('date', new RegExp('(明後日|あさって)' + SUF), () => dateRes(addDays(today, 2)));
  rule('date', new RegExp('(明日|あした)' + SUF), () => dateRes(addDays(today, 1)));
  rule('date', new RegExp('(今日|きょう|本日)' + SUF), () => dateRes(today));
  rule('date', new RegExp('(\\d{1,3})日後' + SUF), m => dateRes(addDays(today, +m[1])));
  rule('date', new RegExp('(再来週|来週|今週)\\s?の?([日月火水木金土])曜日?' + SUF), m => {
    const base = addDays(startOfWeek(today), { 今週: 0, 来週: 7, 再来週: 14 }[m[1]]);
    return dateRes(addDays(base, (WD_IDX[m[2]] - (S.settings.weekStart ?? 1) + 7) % 7));
  });
  rule('date', new RegExp('([日月火水木金土])曜日?' + SUF), m => dateRes(nextWeekday(today, WD_IDX[m[1]])));
  rule('date', new RegExp('(再来週|来週)' + SUF), m => dateRes(addDays(startOfWeek(today), m[1] === '来週' ? 7 : 14)));
  rule('date', new RegExp('月末' + SUF), () => dateRes(monthDay(ty, tm, 31)));

  // --- 時刻 ---
  const timeRes = (ampm, h, mi) => {
    h = +h; mi = +(mi || 0);
    if (ampm && /午後|夜|夕方/.test(ampm) && h < 12) h += 12;
    if (ampm === '午前' && h === 12) h = 0;
    if (h > 23 || mi > 59) return null;
    const hm = `${pad(h)}:${pad(mi)}`;
    return { label: `⏰ ${hm}`, apply: () => { r.dueTime = hm; } };
  };
  rule('time', new RegExp('(午前|午後|朝|夜|夕方)?\\s?(\\d{1,2}):(\\d{2})' + SUF), m => timeRes(m[1], m[2], m[3]));
  rule('time', new RegExp('(午前|午後|朝|夜|夕方)?\\s?(\\d{1,2})時(?!間)(半|(\\d{1,2})分)?' + SUF), m => timeRes(m[1], m[2], m[3] === '半' ? 30 : m[4]));

  // --- 数量 ---
  const qtyRes = n => (n >= 1 && n <= 999) ? { label: `✖ 数量 ${n}`, apply: () => { r.quantity = n; } } : null;
  rule('qty', /(?<pre>^|\s)[x×✕*＊]\s?(\d{1,3})(?=\s|$)/i, m => qtyRes(+m[2]));
  const isShop = (listById(r.listId) || target)?.type === 'shopping';
  if (isShop) rule('qty', /(\d{1,3})\s?(個|本|パック|袋|枚|缶|玉|束|箱|つ|房|尾|切れ)(?=\s|$)/, m => qtyRes(+m[1]));

  // --- 繰り返しの初回日を補う ---
  if (r.repeat !== 'none' && !r.dueDate) {
    if (r.repeat === 'weekly') r.dueDate = nextWeekday(today, repeatWd ?? weekday(today));
    else if (r.repeat === 'weekdays') { let k = today; while (weekday(k) === 0 || weekday(k) === 6) k = addDays(k, 1); r.dueDate = k; }
    else if (r.repeat === 'monthly' && repeatDay) {
      let k = monthDay(ty, tm, repeatDay);
      if (k < today) k = monthDay(tm === 12 ? ty + 1 : ty, tm === 12 ? 1 : tm + 1, repeatDay);
      r.dueDate = k;
    } else r.dueDate = today;
    const c = r.chips.find(x => x.kind === 'repeat');
    if (c) c.label += `（初回 ${relDate(r.dueDate)}）`;
  }
  if (r.dueTime && !r.dueDate) r.dueDate = today;

  r.title = s.replace(/\s+/g, ' ').trim() || String(raw).trim();
  return r;
}

/* =====================================================================
   5. 永続化（書き込み失敗は必ず画面に出す）
   メモリ上の状態を先に更新し、DB 書き込みが失敗したらエラーバーに
   「再試行」を出す。画面のデータは残るので黙って失われない。
   ===================================================================== */
function reportDbError(label, e) {
  console.error(label, e);
  const name = e && e.name ? e.name : 'Error';
  const hint = name === 'QuotaExceededError' ? '（端末の保存容量が不足しています）' : '';
  showError(`${label}に失敗しました${hint}：${name} ${e && e.message ? e.message : e}。画面上のデータはまだ残っています。`, saveAll);
}
async function persist(ops, label = '保存') {
  try { await DB.write(ops); return true; }
  catch (e) { reportDbError(label, e); return false; }
}
const saveTasks = (tasks, label = 'タスクの保存') => persist([{ store: 'tasks', put: [].concat(tasks) }], label);
const saveLists = (lists, label = 'リストの保存') => persist([{ store: 'lists', put: [].concat(lists) }], label);
const saveSettings = () => persist([{ store: 'kv', put: [S.settings] }], '設定の保存');
async function saveAll() {
  try {
    await DB.write([{ store: 'lists', put: S.lists }, { store: 'tasks', put: S.tasks }, { store: 'kv', put: [S.settings] }]);
    $('#errbar').hidden = true;
    showToast('保存し直しました');
  } catch (e) { reportDbError('再保存', e); }
}

async function loadAll() {
  await DB.open();
  const [lists, tasks, history, kv] = await Promise.all(['lists', 'tasks', 'history', 'kv'].map(s => DB.getAll(s)));
  S.lists = lists; S.tasks = tasks; S.history = history;
  S.settings = { ...DEFAULT_SETTINGS, ...(kv.find(r => r.key === 'settings') || {}) };
  const meta = kv.find(r => r.key === 'meta');
  if (!meta) {
    // 初回起動：初期リストを作成（一度作ったら、全部消されても再作成しない）
    if (!S.lists.length) {
      S.lists = DEFAULT_LISTS.map(([name, icon, color, type, completeStyle], i) => ({ id: uid(), name, icon, color, type, completeStyle, order: i }));
    }
    await DB.write([
      { store: 'lists', put: S.lists },
      { store: 'kv', put: [S.settings, { key: 'meta', initializedAt: Date.now(), version: APP_VERSION }] },
    ]);
  }
}

async function requestPersist() {
  try {
    if (navigator.storage && navigator.storage.persisted) {
      S.persisted = await navigator.storage.persisted();
      if (!S.persisted && navigator.storage.persist) S.persisted = await navigator.storage.persist();
    }
  } catch { S.persisted = null; }
  if (S.route.view === 'settings') render();
}

/** 円形プログレスリング */
function ringSVG(pct, size, sw) {
  const r = (size - sw) / 2, c = 2 * Math.PI * r, h = size / 2;
  const off = c * (1 - Math.max(0, Math.min(1, pct)));
  return `<svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true">
    <circle class="ring-bg" cx="${h}" cy="${h}" r="${r}" fill="none" stroke-width="${sw}"/>
    <circle class="ring-fg" cx="${h}" cy="${h}" r="${r}" fill="none" stroke-width="${sw}" stroke-linecap="round"
      stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" transform="rotate(-90 ${h} ${h})" ${pct <= 0 ? 'opacity="0"' : ''}/>
  </svg>`;
}

  if (['calendar', 'stats', 'settings'].includes(v)) return { view: v };
  return { view: 'home' };

}

let renderTimer = 0;
function scheduleRender(ms = 0) { clearTimeout(renderTimer); renderTimer = setTimeout(() => render(), ms); }

function render(scrollTop = false) {
  if (!S.ready) return;
  if ((drag && drag.started) || (sw && sw.active)) { scheduleRender(300); return; }   // ジェスチャ中は描き直さない
  clearTimeout(renderTimer);
  const r = S.route, main = $('#main'), A = $('#paneA'), B = $('#paneB');
  const split = isWide.matches && (r.view === 'home' || r.view === 'list');
  main.classList.toggle('split', split);
  if (split) {
    A.innerHTML = renderHome();
    B.innerHTML = r.view === 'list' ? renderList(r.listId) : renderPickHint();
  } else {
    A.innerHTML = r.view === 'home' ? renderHome()
      : r.view === 'list' ? renderList(r.listId)
      : r.view === 'settings' ? renderSettings()
      : renderSoon(r.view);
    B.innerHTML = '';
  }
  // ナビの現在地
  const cur = r.view === 'list' ? '#/' : r.view === 'home' ? '#/' : '#/' + r.view;
  $$('.nav-btn').forEach(b => { if (b.dataset.to === cur) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (scrollTop) { window.scrollTo(0, 0); B.scrollTop = 0; if (!split) A.scrollTop = 0; }
}

/* ---------- 9-1. ホーム ---------- */
function renderHome() {
  const today = dateKey();
  const all = liveTasks();
  const st = todayStats(all);
  const overdue = all.filter(t => !t.done && dueInfo(t)?.overdue).length;
  const dueToday = all.filter(t => !t.done && t.dueDate === today).length;
  const allDone = st.total > 0 && st.done === st.total;
  const themeIco = S.settings.theme === 'dark' ? ICON.moon : S.settings.theme === 'light' ? ICON.sun : ICON.auto;
  const sel = S.route.view === 'list' ? S.route.listId : null;
  return `
  <header class="phead">
    <div class="ph-title"><b>ToDoTiles</b><small>${fmtLong(today)}</small></div>
    <button class="icon-btn" data-act="theme" aria-label="テーマ切替（現在：${THEME_LABEL[S.settings.theme]}）" title="テーマ：${THEME_LABEL[S.settings.theme]}">${themeIco}</button>
    <button class="txt-btn" data-act="home-edit" aria-pressed="${S.homeEdit}">${S.homeEdit ? '完了' : '編集'}</button>
  </header>
  <section class="hero ${allDone ? 'all-done' : ''}" aria-label="今日の達成度">
    <div class="hero-ring">${ringSVG(st.pct, 112, 12)}
      <div class="hero-pct">${st.total ? Math.round(st.pct * 100) + '<small>%</small>' : '—'}</div></div>
    <div class="hero-text">
      <div class="hero-label">今日の達成度</div>
      <div class="hero-count">${st.total ? `<b>${st.done}</b> / ${st.total} 件完了` : '今日の予定はありません'}</div>
      <div class="chips-row">
        ${overdue ? `<span class="chip danger">⚠ 期限切れ ${overdue}件</span>` : ''}
        ${dueToday ? `<span class="chip accent">📅 今日が期限 ${dueToday}件</span>` : ''}
        ${allDone ? '<span class="chip" style="color:var(--ok)">🎉 すべて完了</span>' : ''}
      </div>
    </div>
  </section>
  ${S.homeEdit ? '<p class="hint">左上の ⠿ をドラッグして並べ替え／タイルをタップして編集</p>' : ''}
  <div class="tiles ${S.homeEdit ? 'editing' : ''}" data-sort="lists">
    ${sortedLists().map(l => tileHTML(l, sel)).join('')}
    <button class="add-tile" data-act="add-list" aria-label="リストを追加">＋<span>リストを追加</span></button>
  </div>`;
}
function tileHTML(l, sel) {
  const ts = tasksOf(l.id);
  const st = todayStats(ts);
  const remain = ts.filter(t => !t.done).length;
  const sub = !ts.length ? 'タスクなし' : remain ? `残り <b>${remain}</b> 件` : 'すべて完了';
  const aria = `${l.name}、残り${remain}件${st.total ? `、今日の達成${Math.round(st.pct * 100)}%` : ''}`;
  return `<div class="tile ${sel === l.id ? 'sel' : ''}" data-sort-item data-id="${l.id}" style="--c:${esc(l.color)}">
    <button class="tile-main" data-act="open-list" data-id="${l.id}" aria-label="${esc(aria)}${S.homeEdit ? '（編集）' : ''}">
      <span class="tile-icon">${ringSVG(st.pct, 80, 7)}<span class="tile-emoji">${esc(l.icon)}</span>
        ${st.total && st.done === st.total ? '<span class="tile-badge">✓</span>' : ''}</span>
      <span class="tile-name">${esc(l.name)}</span>
      <span class="tile-sub">${sub}${st.total ? ` · 今日 ${st.done}/${st.total}` : ''}</span>
    </button>
    ${S.homeEdit ? `<span class="handle tile-grip" aria-hidden="true">${ICON.grip}</span><span class="tile-edit" aria-hidden="true">✎ 編集</span>` : ''}

}
function renderPickHint() {
  return `<div class="placeholder"><div><div class="big">👈</div><p>左のタイルからリストを選んでください</p></div></div>`;
}
function renderSoon(view) {
  const m = { calendar: ['📅', 'カレンダー', 'フェーズ3で追加します（今日・週間・月間）'], stats: ['📊', '統計', 'フェーズ4で追加します'] }[view];

/* ---------- 9-2b. 買い物モード（type="shopping"） ---------- */
function renderShopping(l) {
  const ts = tasksOf(l.id).sort(byOrder);
  const active = ts.filter(t => !t.done);
  const bought = ts.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const freq = frequentItems(l.id);
  const freqShown = S.freqAll ? freq : freq.slice(0, 12);
  let html = listHeader(l) + `
  <div class="shop-add">
    <label style="flex:1;display:flex"><span class="sr-only">品名</span>
      <input class="inp" type="text" id="shop-input" data-list="${l.id}" placeholder="＋ 品名を追加（例：牛乳 ×2）" enterkeyhint="done" autocomplete="off" maxlength="100"></label>
    <button class="btn primary" data-act="shop-add" data-id="${l.id}">追加</button>
  </div>
  <div class="list-summary"><span>買う物 <b style="color:var(--text)">${active.length}</b> 品</span><span>タップで購入済み</span></div>`;

  html += active.length
    ? `<div class="shop-grid">${active.map(t => shopItem(t, l)).join('')}</div>`
    : `<div class="empty"><div class="big">${ts.length ? '🎉' : '🛒'}</div><p>${ts.length ? '買う物はすべて購入済みです' : '買う物はまだありません。<br>上の欄か「よく買う物」から追加できます。'}</p></div>`;

  if (freq.length) {
    html += `<div class="sec-head"><span>よく買う物</span>
      <button class="txt-btn" data-act="freq-edit" aria-pressed="${!!S.freqEdit}">${S.freqEdit ? '完了' : '編集'}</button></div>
      <div class="freq ${S.freqEdit ? 'editing' : ''}">${freqShown.map(h => `
        <button class="freq-chip" data-act="${S.freqEdit ? 'freq-del' : 'freq-add'}" data-key="${esc(h.name)}" data-id="${l.id}"
          aria-label="${esc(h.label)}（${h.count}回）${S.freqEdit ? 'を候補から削除' : 'を追加'}">
          <span class="fe">${esc(h.icon || guessEmoji(h.label))}</span><span class="fn">${esc(h.label)}</span><span class="fc">${S.freqEdit ? '✕' : h.count + '回'}</span></button>`).join('')}
      </div>
      ${freq.length > 12 ? `<div style="text-align:center"><button class="link-btn" data-act="freq-all">${S.freqAll ? '閉じる' : `ほか ${freq.length - 12}件を表示`}</button></div>` : ''}`;

  if (bought.length) {
    html += `<div class="sec-head"><span>購入済み ${bought.length}品</span>
      <button class="txt-btn" data-act="clear-done" data-id="${l.id}">購入済みをすべてクリア</button></div>
      <div class="bought-list">${bought.map(t => `<button class="bought-chip" data-act="toggle" data-id="${t.id}" aria-label="${esc(t.title)} を未購入に戻す">
        <span>${esc(itemIcon(t))}</span><s>${esc(t.title)}</s>${t.quantity > 1 ? `<small>×${t.quantity}</small>` : ''}</button>`).join('')}</div>`;
  }
  return html;
}
function shopItem(t, l) {
  const q = t.quantity || 1;
  const due = dueInfo(t);
  return `<div class="shop-item" data-id="${t.id}" style="--c:${esc(l.color)}">
    <button class="shop-main" data-act="buy" data-id="${t.id}" aria-label="${esc(t.title)}${q > 1 ? ` ${q}個` : ''} を購入済みにする">
      <span class="shop-emoji" aria-hidden="true">${esc(itemIcon(t))}</span>
      <span class="shop-name">${t.priority ? `<span class="prio-dot p${t.priority}"></span>` : ''}${esc(t.title)}</span>
      ${due || t.note ? `<span class="shop-meta">${due ? `<span class="due ${due.overdue ? 'overdue' : due.today ? 'today' : ''}">${esc(due.label)}</span>` : ''}${t.note ? ' 📝' : ''}</span>` : ''}
    </button>
    <button class="shop-edit" data-act="edit-task" data-id="${t.id}" aria-label="${esc(t.title)} を編集">✎</button>
    <div class="shop-qty">
      <button data-act="qty" data-d="-1" data-id="${t.id}" aria-label="数量を減らす" ${q <= 1 ? 'disabled' : ''}>−</button>
      <span aria-label="数量 ${q}">×${q}</span>
      <button data-act="qty" data-d="1" data-id="${t.id}" aria-label="数量を増やす">＋</button>

function renderList(id) {
  const l = listById(id);
  if (!l) return renderPickHint();
  if (l.type === 'shopping') return renderShopping(l);
  const ts = tasksOf(id).sort(byOrder);
  const st = todayStats(ts);
  const style = l.completeStyle;
  const active = style === 'check' ? ts : ts.filter(t => !t.done);
  const done = ts.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const remain = ts.length - done.length;

  let html = listHeader(l) + `
  <div class="list-summary">
    <span>残り <b style="color:var(--text)">${remain}</b> 件</span>
    ${st.total ? `<span>今日 ${st.done}/${st.total} 完了（${Math.round(st.pct * 100)}%）</span>` : ''}
    <span class="chip">${esc(STYLE_INFO[style].label)}</span>
  </div>
  <div class="style-${style}">`;

  if (active.length) {
    html += `<div class="tasks" data-sort="tasks" data-list="${l.id}">${active.map(t => taskRow(t, l, true)).join('')}</div>`;
  } else {
    html += ts.length
      ? `<div class="empty"><div class="big">🎉</div><p>すべて完了しました</p></div>`
      : `<div class="empty"><div class="big">${esc(l.icon)}</div><p>タスクはまだありません。<br>下の ＋ から追加できます。</p></div>`;
  }

  if (style === 'strike' && done.length) {
    html += `<div class="sec-head"><span>完了 ${done.length}件</span><button class="txt-btn" data-act="clear-done" data-id="${l.id}">完了済みを削除</button></div>
      <div class="tasks">${done.map(t => taskRow(t, l, false)).join('')}</div>`;
  }
  if (style === 'check' && done.length) {
    html += `<div class="sec-head"><span></span><button class="txt-btn" data-act="clear-done" data-id="${l.id}">完了済み ${done.length}件を削除</button></div>`;
  }
  if (style === 'vanish' && done.length) {
    const open = S.historyOpen.has(l.id);
    const shown = done.slice(0, 100);
    html += `<div class="sec-head"><button class="sec-toggle" data-act="history" data-id="${l.id}" aria-expanded="${open}">${open ? '▾' : '▸'} 完了履歴 ${done.length}件</button>
      ${open ? `<button class="txt-btn" data-act="clear-done" data-id="${l.id}">履歴を消去</button>` : ''}</div>
      ${open ? `<div class="tasks">${shown.map(t => taskRow(t, l, false, true)).join('')}</div>${done.length > shown.length ? `<p class="hint" style="margin-top:8px">ほか ${done.length - shown.length}件</p>` : ''}` : ''}`;
  }
  html += `</div>`;
  return html;
}

function taskRow(t, l, sortable, showDoneDate = false) {
  const due = dueInfo(t);
  const subs = t.subtasks || [];
  const subDone = subs.filter(s => s.done).length;
  const open = S.expanded.has(t.id);
  const meta = [];
  if (showDoneDate && t.doneAt) meta.push(`<span>✓ ${fmtMD(dateKey(t.doneAt))}</span>`);
  if (due) meta.push(`<span class="due ${due.overdue ? 'overdue' : due.today ? 'today' : ''}">${due.overdue ? '⚠ ' : '📅 '}${esc(due.label)}</span>`);
  if (repeatLabel(t)) meta.push(`<span title="繰り返し">🔁 ${esc(repeatLabel(t))}</span>`);
  if (t.note) meta.push('<span title="メモあり">📝 メモ</span>');
  if (subs.length) meta.push(`<button class="sub-toggle" data-act="sub-expand" data-id="${t.id}" aria-expanded="${open}">☑ ${subDone}/${subs.length} ${open ? '▾' : '▸'}</button>`);
  const prio = t.priority ? `<span class="prio-dot p${t.priority}" title="優先度：${PRIO_LABEL[t.priority]}"></span><span class="sr-only">優先度${PRIO_LABEL[t.priority]}</span>` : '';
  return `<div class="task ${t.done ? 'done' : ''}" ${sortable ? 'data-sort-item' : ''} data-id="${t.id}" style="--c:${esc(l.color)}">
    <div class="swipe-bg" aria-hidden="true"><span class="sb-l">✓ ${t.done ? '未完了に戻す' : '完了'}</span><span class="sb-r">🗑 削除</span></div>
    <div class="task-body">
      <button class="chk" data-act="toggle" data-id="${t.id}" role="checkbox" aria-checked="${t.done}" aria-label="${esc(t.title)} を${t.done ? '未完了に戻す' : '完了にする'}"><i>${ICON.check}</i></button>
      <div class="task-col">
        <div class="task-main" data-act="edit-task" data-id="${t.id}">
          <div class="task-title">${prio}<span class="tt">${esc(t.title)}</span></div>
          <div class="task-meta">${meta.join('')}</div>
        </div>
        ${subs.length && open ? `<div class="subs">${subs.map(s => `
          <div class="sub ${s.done ? 'done' : ''}"><button class="sub-chk" data-act="sub-toggle" data-id="${t.id}" data-sid="${s.id}" role="checkbox" aria-checked="${!!s.done}" aria-label="${esc(s.title)}"><i>${ICON.check}</i></button><span class="sub-t">${esc(s.title)}</span></div>`).join('')}</div>` : ''}
      </div>
      ${sortable ? `<div class="handle" aria-hidden="true" title="ドラッグで並べ替え">${ICON.grip}</div>` : ''}
    </div>
  </div>`;
}

/* =====================================================================
   10. タスク操作（完了 / 削除 / サブタスク / 並べ替え）
   ===================================================================== */
async function toggleDone(id) {
  const t = taskById(id); if (!t) return;
  const l = listById(t.listId);
  const before = clone(t);
  const wasAll = allDoneToday();
  t.done = !t.done;
  t.doneAt = t.done ? Date.now() : null;

  // 先に見た目だけ変えてアニメーションさせ、少し後に描き直す
  const rows = $$(`.task[data-id="${id}"]`);
  rows.forEach(r => { r.classList.toggle('done', t.done); const c = r.querySelector('.chk'); if (c) c.setAttribute('aria-checked', t.done); });
  const shop = l.type === 'shopping';
  let delay = 0;
  if (shop) {
    // 買い物：アイコンが縮んで消える
    if (t.done) { delay = reduceMotion.matches ? 0 : 420; $$(`.shop-item[data-id="${id}"]`).forEach(r => r.classList.add('bought')); }
  } else if (t.done && l.completeStyle === 'vanish') {
    delay = reduceMotion.matches ? 0 : 620;
    rows.forEach(r => { r.classList.add('vanishing'); setTimeout(() => collapse(r), 260); });
  } else if (l.completeStyle === 'strike') {
    delay = reduceMotion.matches ? 0 : 480;
  }
  scheduleRender(delay);
  await saveTasks(t, t.done ? '完了の保存' : '未完了への変更');
  if (shop) await recordPurchase(t, t.done ? 1 : -1);

  if (t.done) {
    showUndo(shop ? `「${t.title}」を購入済みにしました` : `「${t.title}」を完了しました`, async () => {
      Object.assign(t, before); render(); await saveTasks(t, '元に戻す');
      if (shop) await recordPurchase(t, -1);
    });
    if (!wasAll && allDoneToday()) setTimeout(celebrate, delay + 60);
  }
}

async function deleteTask(id, { animate = true } = {}) {
  const t = taskById(id); if (!t) return;
  S.tasks = S.tasks.filter(x => x !== t);
  if (animate) {
    $$(`.task[data-id="${id}"]`).forEach(r => collapse(r));
    $$(`.shop-item[data-id="${id}"]`).forEach(r => r.classList.add('bought'));
  }
  scheduleRender(animate && !reduceMotion.matches ? 340 : 0);
  showUndo(`「${t.title}」を削除しました`, async () => {
    S.tasks.push(t); render(); await saveTasks(t, '削除の取り消し');
  });
  await persist([{ store: 'tasks', del: [id] }], 'タスクの削除');
}

async function clearDone(listId) {
  const done = tasksOf(listId).filter(t => t.done);
  if (!done.length) return;
  S.tasks = S.tasks.filter(t => !done.includes(t));
  render();
  const shop = listById(listId)?.type === 'shopping';
  showUndo(shop ? `購入済み ${done.length}品をクリアしました` : `完了済み ${done.length}件を削除しました`, async () => {
    S.tasks.push(...done); render(); await saveTasks(done, '削除の取り消し');
  });
  await persist([{ store: 'tasks', del: done.map(t => t.id) }], '完了済みの削除');
}

/* ---------- 買い物：追加・数量・よく買う物 ---------- */
/** 同じ品名が未購入で残っていれば数量を足す。戻り値 {task, merged} */
function addShoppingItem(listId, title, { quantity = 1, ...extra } = {}) {
  const key = normName(title);
  const same = tasksOf(listId).find(t => !t.done && normName(t.title) === key);
  if (same) { same.quantity = Math.min(999, (same.quantity || 1) + quantity); return { task: same, merged: true }; }
  const h = S.history.find(x => x.name === key);
  const t = newTask(listId, title, { quantity, ...extra });
  if (h && h.icon && !t.icon) t.icon = h.icon;
  S.tasks.push(t);
  return { task: t, merged: false };
}
async function changeQty(id, d) {
  const t = taskById(id); if (!t) return;
  const q = Math.max(1, Math.min(999, (t.quantity || 1) + d));
  if (q === t.quantity) return;
  t.quantity = q; render(); await saveTasks(t, '数量の保存');
}
async function shopAddFromInput(listId) {
  const input = $('#shop-input');
  if (!input) return;
  const raw = input.value.trim();
  if (!raw) { input.focus(); return; }
  const p = parseQuick(raw, { listId });
  const target = listById(p.listId) || listById(listId);
  let res;
  if (target.type === 'shopping') res = addShoppingItem(target.id, p.title, { quantity: p.quantity, dueDate: p.dueDate, dueTime: p.dueTime, repeat: p.repeat });
  else { const t = newTask(target.id, p.title, { dueDate: p.dueDate, dueTime: p.dueTime, repeat: p.repeat }); S.tasks.push(t); res = { task: t }; }
  render();
  const again = $('#shop-input'); if (again) again.focus();   // 続けて入力できるように
  showToast(res.merged ? `「${res.task.title}」の数量を ×${res.task.quantity} にしました` : `「${res.task.title}」を${target.id === listId ? '' : ` ${target.icon}${target.name} に`}追加しました`);
  await saveTasks(res.task, '品目の追加');
}
async function freqAdd(listId, key) {
  const h = S.history.find(x => x.name === key); if (!h) return;
  const { task } = addShoppingItem(listId, h.label, h.icon ? { icon: h.icon } : {});
  render();
  showToast(`${h.icon || guessEmoji(h.label)} ${h.label} を追加しました`);
  await saveTasks(task, '品目の追加');
}
async function freqDelete(key) {
  const h = S.history.find(x => x.name === key); if (!h) return;
  S.history = S.history.filter(x => x !== h);
  render();
  showUndo(`「${h.label}」を候補から外しました`, async () => {
    S.history.push(h); render(); await persist([{ store: 'history', put: [h] }], '候補の復元');
  });
  await persist([{ store: 'history', del: [key] }], '候補の削除');
}

async function toggleSub(taskId, subId) {
  const t = taskById(taskId); if (!t) return;
  const s = t.subtasks.find(x => x.id === subId); if (!s) return;
  s.done = !s.done;
  render();
  await saveTasks(t, 'サブタスクの保存');
}

async function setPriority(id, p) {
  const t = taskById(id); if (!t) return;
  t.priority = p; render(); await saveTasks(t);
}
async function moveToTop(id) {
  const t = taskById(id); if (!t) return;
  t.order = tasksOf(t.listId).reduce((m, x) => Math.min(m, x.order ?? 0), 0) - 1;
  render(); await saveTasks(t);
}

/** ドラッグ並べ替えの確定 */
async function applyReorder(kind, ids) {
  if (kind === 'lists') {
    const changed = [];
    ids.forEach((id, i) => { const l = listById(id); if (l && l.order !== i) { l.order = i; changed.push(l); } });
    render();
    if (changed.length) await saveLists(changed, '並べ替えの保存');
  } else {
    const changed = [];
    ids.forEach((id, i) => { const t = taskById(id); if (t && t.order !== i) { t.order = i; changed.push(t); } });
    render();
    if (changed.length) await saveTasks(changed, '並べ替えの保存');
  }
}

/** 行を高さごと畳むアニメーション */
function collapse(el) {
  if (reduceMotion.matches) { el.style.display = 'none'; return; }
  el.style.height = el.offsetHeight + 'px';
  el.style.overflow = 'hidden';
  void el.offsetHeight;
  el.style.transition = 'height .3s ease, opacity .3s ease, margin .3s ease';
  el.style.height = '0px'; el.style.opacity = '0'; el.style.marginBottom = '-8px';
}

/* =====================================================================
   11. リスト操作
   ===================================================================== */
async function deleteList(id) {
  const l = listById(id); if (!l) return;
  const ts = tasksOf(id);
  const ok = await confirmDialog({
    title: `「${l.name}」を削除しますか？`,
    message: ts.length ? `中のタスク ${ts.length}件も一緒に削除されます。` : 'このリストにタスクはありません。',
    ok: '削除する', danger: true,
  });
  if (!ok) return;
  closeSheet(true);
  S.lists = S.lists.filter(x => x !== l);
  S.tasks = S.tasks.filter(t => t.listId !== id);
  if (S.route.view === 'list' && S.route.listId === id) go('#/'); else render();
  showUndo(`リスト「${l.name}」を削除しました`, async () => {
    S.lists.push(l); S.tasks.push(...ts); render();
    await persist([{ store: 'lists', put: [l] }, { store: 'tasks', put: ts }], '削除の取り消し');
  });
  await persist([{ store: 'lists', del: [id] }, { store: 'tasks', del: ts.map(t => t.id) }], 'リストの削除');
}

/* =====================================================================
   12. シート（ボトムシート）・確認ダイアログ・右クリックメニュー
   ===================================================================== */
let sheetState = null;
function openSheet({ title, body, foot = '', onMount, onClose }) {
  closeSheet(true);
  closeMenu();
  const root = $('#sheetRoot');
  const prevFocus = document.activeElement;
  root.innerHTML = `<div class="scrim" data-close></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1">
      <div class="sheet-head"><h2 id="sheet-title">${esc(title)}</h2><button class="icon-btn" data-close aria-label="閉じる">${ICON.close}</button></div>
      <div class="sheet-body">${body}</div>
      ${foot ? `<div class="sheet-foot">${foot}</div>` : ''}
    </div>`;
  root.hidden = false;
  document.body.classList.add('sheet-open');
  const el = root.querySelector('.sheet');
  $$('[data-close]', root).forEach(b => b.addEventListener('click', () => closeSheet()));
  sheetState = { root, el, prevFocus, onClose };
  if (onMount) onMount(el);   // iOSでキーボードを出すため、focus はここで同期的に行う
  if (!el.contains(document.activeElement)) el.focus({ preventScroll: true });
}
function closeSheet(silent = false) {
  if (!sheetState) return;
  const s = sheetState; sheetState = null;
  s.root.innerHTML = ''; s.root.hidden = true;
  document.body.classList.remove('sheet-open');
  if (s.onClose) s.onClose();
  if (!silent && s.prevFocus && document.contains(s.prevFocus)) s.prevFocus.focus({ preventScroll: true });
}

let dialogResolve = null;
function confirmDialog({ title, message = '', ok = 'OK', cancel = 'キャンセル', danger = false }) {
  return new Promise(resolve => {
    const root = $('#dialogRoot');
    const prev = document.activeElement;
    root.innerHTML = `<div class="scrim" data-v="0"></div>
      <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-m">
        <h3 id="dlg-t">${esc(title)}</h3><p id="dlg-m">${esc(message)}</p>
        <div class="row"><button class="btn" data-v="0">${esc(cancel)}</button><button class="btn ${danger ? 'danger-fill' : 'primary'}" data-v="1">${esc(ok)}</button></div>
      </div>`;
    root.hidden = false;
    const finish = v => { root.hidden = true; root.innerHTML = ''; dialogResolve = null; if (prev && document.contains(prev)) prev.focus({ preventScroll: true }); resolve(v); };
    dialogResolve = finish;
    root.onclick = e => { const b = e.target.closest('[data-v]'); if (b) finish(b.dataset.v === '1'); };
    root.querySelector('.btn[data-v="0"]').focus();
  });
}

function openMenu(x, y, items) {
  const m = $('#menu');
  m.innerHTML = items.map((it, i) => {
    if (it === '-') return '<hr>';
    if (it.prio !== undefined) return `<div class="menu-prio"><span>優先度</span>${[3, 2, 1, 0].map(p =>
      `<button role="menuitemradio" aria-checked="${it.prio === p}" data-p="${p}" aria-label="優先度${PRIO_LABEL[p]}">${p ? `<span class="prio-dot p${p}" style="margin:0"></span>` : '—'}</button>`).join('')}</div>`;
    return `<button role="menuitem" data-i="${i}" class="${it.danger ? 'danger' : ''}">${it.label}</button>`;
  }).join('');
  m.hidden = false;
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.max(8, Math.min(x, innerWidth - w - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(y, innerHeight - h - 8)) + 'px';
  m.onclick = e => {
    const p = e.target.closest('[data-p]');
    const b = e.target.closest('[data-i]');
    const prioItem = items.find(it => it.prio !== undefined);
    closeMenu();
    if (p && prioItem) prioItem.onPrio(+p.dataset.p);
    else if (b) items[+b.dataset.i].fn();
  };
  const first = m.querySelector('button'); if (first) first.focus({ preventScroll: true });
}
function closeMenu() { const m = $('#menu'); if (!m.hidden) { m.hidden = true; m.innerHTML = ''; } }
